<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind 75 Practice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>Blind 75</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-learn" onclick="switchMode('learn')">📚 Learn</button>
    <button class="mode-tab" id="tab-drills" onclick="switchMode('drills')">🧠 Drills</button>
    <button class="mode-tab" id="tab-bigo" onclick="switchMode('bigo')">Big-O</button>
    <button class="mode-tab" id="tab-sorting" onclick="switchMode('sorting')">Sorting</button>
    <button class="mode-tab" id="tab-problems" onclick="switchMode('problems')">Problems</button>
    <button class="mode-tab" id="tab-mock" onclick="switchMode('mock')">🎯 Mock</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="pFill"></div></div>
  <span class="progress-text" id="pText">0 / 75</span>
  <button class="btn-cfg" onclick="exportData()">⬇ Export</button>
  <button class="btn-cfg" onclick="importData()">⬆ Import</button>
  <button class="btn-cfg" onclick="openCfg()">⚙ Config</button>
</header>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">
<main id="appMain" class="mode-problems">
  <aside class="sidebar">
    <div class="filters">
      <input id="search" type="text" placeholder="Search…" oninput="renderList()">
      <div class="filter-row">
        <select id="fDiff" onchange="renderList()">
          <option value="All">All Levels</option>
          <option>Easy</option><option>Medium</option><option>Hard</option>
        </select>
        <select id="fCat" onchange="renderList()">
          <option value="All">All Categories</option>
        </select>
      </div>
      <div class="filter-row">
        <select id="fStatus" onchange="renderList()">
          <option value="All">All Status</option>
          <option value="Not Done">Not Done</option>
          <option value="Done">Done</option>
          <option value="Review">Needs Review</option>
          <option value="Spaced Review">Due for Spaced Review (14+ days)</option>
        </select>
        <button class="btn btn-ghost btn-random" onclick="randomProblem()">🎲 Random</button>
      </div>
    </div>
    <ul class="problem-list" id="pList"></ul>
  </aside>
  <section class="panel" id="panel">
    <div class="empty"><div class="ico">🎯</div><p>Select a problem to begin</p></div>
  </section>
</main>

<div class="overlay" id="cfgModal">
  <div class="modal">
    <h3>Google Sheets Config</h3>
    <label>Sheet ID (from the URL of your published sheet)</label>
    <input id="sheetId" type="text" placeholder="1BZhGLVVOs…">
    <p>Publish your sheet: File → Share → Publish to web. Columns: Name, LeetCode URL, YouTube URL, Difficulty, Data Structure, Category.</p>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeCfg()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCfg()">Save & Reload</button>
    </div>
  </div>
</div>

<!-- Data (no dependencies, must come first) -->
<script src="js/data/problems.js"></script>
<script src="js/data/solutions.js"></script>
<script src="js/data/bigo.js"></script>
<script src="js/data/sorting.js"></script>
<script src="js/data/learning-topics.js"></script>
<script src="js/data/comprehension.js"></script>
<script src="js/data/example-annotations.js"></script>
<script src="js/data/example-line-quizzes.js"></script>
<script src="js/data/drills.js"></script>
<script src="js/data/lazy.js"></script>
<script src="js/data/example-tests.js"></script>

<!-- Shared helpers + global state -->
<script src="js/utils.js"></script>
<script src="js/state.js"></script>

<!-- Feature modules -->
<script src="js/svgs.js"></script>
<script src="js/pyodide-runner.js"></script>
<script src="js/timer.js"></script>
<script src="js/sorting-trace.js"></script>
<script src="js/problems-panel.js"></script>
<script src="js/learn.js"></script>
<script src="js/drills.js"></script>
<script src="js/bigo.js"></script>
<script src="js/sorting.js"></script>
<script src="js/mock.js"></script>

<!-- Entry point: switchMode + init() (must come last) -->
<script src="js/main.js"></script>
</body>
</html>
