<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind 75 Practice</title>
  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
      --border: #2a2a2a; --text: #e8e8e8; --muted: #777;
      --easy: #00b894; --medium: #f0a500; --hard: #e17055;
      --accent: #7c6af7; --accent-hover: #6c5ce7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: grid; grid-template-rows: 56px 1fr; overflow: hidden;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 10px;
    }
    header h1 { font-size: 17px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .progress-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--easy)); border-radius: 3px; transition: width .3s; }
    .progress-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .btn-cfg { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .btn-cfg:hover { color: var(--text); }
    main { overflow: hidden; }
    main.mode-problems { display: grid; grid-template-columns: 320px 1fr; }
    main.mode-bigo { display: grid; grid-template-columns: 280px 1fr; }
    main.mode-sorting { display: grid; grid-template-columns: 280px 1fr; }
    main.mode-drills { display: grid; grid-template-columns: 280px 1fr; }
    main.mode-mock { display: grid; grid-template-columns: 280px 1fr; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .filters { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
    .filters input, .filters select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 9px; font-size: 12px; width: 100%;
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--accent); }
    .filters select option { background: #1a1a1a; }
    .filter-row { display: flex; gap: 7px; }
    .filter-row select { flex: 1; }
    .problem-list { list-style: none; overflow-y: auto; flex: 1; }
    .problem-list::-webkit-scrollbar { width: 3px; }
    .problem-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-header {
      padding: 7px 12px 4px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); background: var(--bg);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; gap: 6px;
    }
    .cat-header .cat-name { flex: 1; }
    .cat-header .cat-pct { font-size: 9px; font-variant-numeric: tabular-nums; }
    .cat-header .cat-bar { width: 36px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
    .cat-header .cat-bar-fill { height: 100%; border-radius: 2px; background: var(--muted); transition: width .3s; }
    .cat-header.mastered { color: var(--easy); background: rgba(0,184,148,.06); }
    .cat-header.mastered .cat-bar-fill { background: var(--easy); }
    .cat-divider {
      padding: 5px 12px 3px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: rgba(0,184,148,.5); background: rgba(0,184,148,.04);
      border-bottom: 1px solid rgba(0,184,148,.12); border-top: 1px solid rgba(0,184,148,.12);
    }
    .problem-item {
      display: flex; align-items: center; padding: 8px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border); gap: 9px; transition: background .1s;
    }
    .problem-item:hover { background: var(--surface2); }
    .problem-item.active { background: rgba(124,106,247,.12); border-left: 3px solid var(--accent); padding-left: 9px; }
    .problem-item.done .p-name { text-decoration: line-through; opacity: .5; }
    .chk {
      width: 15px; height: 15px; border-radius: 3px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 9px; cursor: pointer; transition: all .1s;
    }
    .chk.on { background: var(--easy); border-color: var(--easy); color: #fff; }
    .p-info { flex: 1; min-width: 0; }
    .p-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .review-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--medium); flex-shrink: 0; }
    .spaced-dot { width: 6px; height: 6px; border-radius: 50%; background: #4aa6ff; flex-shrink: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot.Easy { background: var(--easy); }
    .dot.Medium { background: var(--medium); }
    .dot.Hard { background: var(--hard); }
    .panel { display: flex; align-items: flex-start; justify-content: center; padding: 28px; overflow-y: auto; }
    .empty { text-align: center; color: var(--muted); margin-top: 80px; }
    .empty .ico { font-size: 40px; margin-bottom: 10px; }
    .panel-content { width: 100%; max-width: 520px; }
    .panel-header { margin-bottom: 22px; }
    .panel-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 9px; line-height: 1.3; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; }
    .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
    .badge.Easy { background: rgba(0,184,148,.15); color: var(--easy); }
    .badge.Medium { background: rgba(240,165,0,.15); color: var(--medium); }
    .badge.Hard { background: rgba(225,112,85,.15); color: var(--hard); }
    .badge.cat { background: rgba(124,106,247,.15); color: var(--accent); }
    .badge.ds { background: rgba(255,255,255,.06); color: var(--muted); }
    .timer-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px; text-align: center; margin-bottom: 16px;
    }
    .timer-num {
      font-size: 68px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace;
      font-variant-numeric: tabular-nums; letter-spacing: -2px; line-height: 1; margin-bottom: 20px;
      transition: color .3s;
    }
    .timer-num.warn { color: var(--medium); }
    .timer-num.danger { color: var(--hard); }
    .timer-btns { display: flex; gap: 9px; justify-content: center; }
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: none; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .action-row { display: flex; gap: 9px; margin-bottom: 12px; }
    .btn-yt { background: #c00; color: #fff; flex: 1; justify-content: center; }
    .btn-yt:hover { background: #a00; }
    .btn-lc { background: #ffa116; color: #1a1a1a; flex: 1; justify-content: center; }
    .btn-lc:hover { background: #e0901a; }
    .btn-random { flex: 0 0 auto; padding: 6px 11px; font-size: 12px; }
    .outcome-section { margin-bottom: 10px; }
    .outcome-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; text-align: center; letter-spacing: .5px; }
    .outcome-row { display: flex; gap: 8px; }
    .btn-outcome { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 9px 6px; border-radius: 8px; border: 1px solid; cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s; }
    .btn-outcome.solved { background: rgba(0,184,148,.1); color: var(--easy); border-color: rgba(0,184,148,.3); }
    .btn-outcome.solved:hover { background: rgba(0,184,148,.22); }
    .btn-outcome.hint { background: rgba(240,165,0,.1); color: var(--medium); border-color: rgba(240,165,0,.3); }
    .btn-outcome.hint:hover { background: rgba(240,165,0,.22); }
    .btn-outcome.watched { background: rgba(225,112,85,.1); color: var(--hard); border-color: rgba(225,112,85,.3); }
    .btn-outcome.watched:hover { background: rgba(225,112,85,.22); }
    .done-state { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .done-badge { flex: 1; text-align: center; padding: 9px; background: rgba(0,184,148,.1); color: var(--easy); border: 1px solid rgba(0,184,148,.25); border-radius: 8px; font-size: 13px; font-weight: 500; }
    .btn-review {
      width: 100%; justify-content: center; margin-top: 8px;
      background: rgba(240,165,0,.08); color: var(--medium); border: 1px solid rgba(240,165,0,.2);
    }
    .btn-review:hover { background: rgba(240,165,0,.15); }
    .btn-review.on { background: var(--medium); color: #1a1a1a; border-color: var(--medium); }
    .attempts-section { margin-top: 14px; }
    .attempts-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .attempt-list { display: flex; flex-direction: column; gap: 3px; }
    .attempt-item { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .notes-section { margin-top: 14px; }
    .notes-section label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px; }
    .notes-textarea {
      width: 100%; min-height: 90px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 12px;
      font-family: inherit; resize: vertical; line-height: 1.5;
    }
    .notes-textarea:focus { outline: none; border-color: var(--accent); }
    .notes-textarea::placeholder { color: var(--muted); }
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
      z-index: 100; align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 380px; }
    .modal h3 { margin-bottom: 14px; font-size: 15px; }
    .modal label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px; }
    .modal input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 12px; width: 100%; margin-bottom: 10px; }
    .modal p { font-size: 11px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; }
    /* === mode tabs === */
    .mode-tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
    .mode-tab { background: transparent; border: none; color: var(--muted); padding: 5px 13px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active { background: var(--surface2); color: var(--text); }
    /* === quiz card === */
    .quiz-wrap { display: flex; flex-direction: column; align-items: center; padding: 32px 24px; overflow-y: auto; height: 100%; }
    .quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; width: 100%; max-width: 640px; }
    .quiz-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 11px; color: var(--muted); }
    .quiz-bar .streak { color: var(--medium); font-weight: 600; }
    .quiz-bar .session { font-variant-numeric: tabular-nums; }
    .quiz-progressbar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 26px; }
    .quiz-progressbar > div { height: 100%; background: var(--accent); transition: width .3s; }
    .quiz-scenario { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 22px; text-align: center; }
    .quiz-question { font-size: 15px; font-weight: 500; line-height: 1.5; margin-bottom: 18px; }
    .complexity-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
    .btn-complexity { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 6px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; cursor: pointer; transition: all .15s; }
    .btn-complexity:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-complexity:disabled { cursor: default; opacity: .5; }
    .btn-complexity.correct, .btn-complexity.correct:disabled { background: rgba(0,184,148,.2); border-color: var(--easy); color: var(--easy); opacity: 1; }
    .btn-complexity.wrong, .btn-complexity.wrong:disabled { background: rgba(225,112,85,.18); border-color: var(--hard); color: var(--hard); opacity: 1; }
    .mc-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    .btn-mc { text-align: left; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 14px; font-size: 13px; cursor: pointer; transition: all .15s; line-height: 1.4; }
    .btn-mc:hover:not(:disabled) { border-color: var(--accent); }
    .btn-mc:disabled { cursor: default; opacity: .5; }
    .btn-mc.correct, .btn-mc.correct:disabled { background: rgba(0,184,148,.15); border-color: var(--easy); color: var(--easy); opacity: 1; }
    .btn-mc.wrong, .btn-mc.wrong:disabled { background: rgba(225,112,85,.15); border-color: var(--hard); color: var(--hard); opacity: 1; }
    .quiz-feedback { font-size: 13px; line-height: 1.55; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
    .quiz-feedback.right { background: rgba(0,184,148,.08); color: var(--easy); border: 1px solid rgba(0,184,148,.25); }
    .quiz-feedback.wrong { background: rgba(225,112,85,.08); color: var(--hard); border: 1px solid rgba(225,112,85,.25); }
    .quiz-feedback .exp { color: var(--text); margin-top: 6px; font-weight: 400; }
    .quiz-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .quiz-summary { text-align: center; }
    .quiz-summary .big-num { font-size: 48px; font-weight: 700; color: var(--accent); margin: 14px 0; font-variant-numeric: tabular-nums; }
    .quiz-summary .sub { color: var(--muted); margin-bottom: 22px; }
    /* === stats sidebar === */
    .stats-section { padding: 12px; border-bottom: 1px solid var(--border); }
    .stats-section h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; font-weight: 700; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
    .stat-cell .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-cell .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 11px; border-bottom: 1px solid var(--border); }
    .stat-row .acc { font-variant-numeric: tabular-nums; font-weight: 600; }
    .stat-row .acc.high { color: var(--easy); }
    .stat-row .acc.mid { color: var(--medium); }
    .stat-row .acc.low { color: var(--hard); }
    .stats-list { overflow-y: auto; flex: 1; }
    .stats-list::-webkit-scrollbar { width: 3px; }
    .stats-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    /* === sorting === */
    .submode-toggle { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--border); }
    .submode-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .submode-btn:hover { color: var(--text); }
    .submode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .algo-group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 8px 12px 4px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .algo-item { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); gap: 8px; transition: background .1s; font-size: 13px; }
    .algo-item:hover { background: var(--surface2); }
    .algo-item.active { background: rgba(124,106,247,.12); border-left: 3px solid var(--accent); padding-left: 9px; }
    .algo-item .a-name { flex: 1; }
    .algo-item .a-tag { font-size: 9px; color: var(--accent); background: rgba(124,106,247,.12); padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .algo-item .a-tag.dim { color: var(--muted); background: rgba(255,255,255,.04); }
    .algo-detail { padding: 32px; overflow-y: auto; max-width: 720px; }
    .algo-detail h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .algo-detail .group-badge { display: inline-block; background: rgba(124,106,247,.15); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-bottom: 18px; }
    .algo-detail .summary { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 16px; }
    .algo-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 22px; }
    .algo-stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; }
    .algo-stat-box .lbl { font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
    .algo-stat-box .val { font-size: 13px; font-weight: 600; font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.3; }
    .algo-stat-box .val.fast { color: var(--easy); }
    .algo-stat-box .val.slow { color: var(--hard); }
    .algo-section { margin-bottom: 18px; }
    .algo-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    .algo-section p { font-size: 13px; line-height: 1.55; color: var(--text); }
    .pseudocode { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.6; color: #a8d8b9; overflow-x: auto; white-space: pre; }
    .quiz-code { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.55; color: #a8d8b9; text-align: left; margin: 14px 0 18px; white-space: pre; overflow-x: auto; }
    .trace-section { margin-top: 22px; padding: 18px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
    .trace-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; font-weight: 700; }
    .trace-array { display: flex; gap: 6px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
    .trace-cell { width: 38px; height: 38px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', monospace; font-size: 13px; font-weight: 600; transition: all .25s; }
    .trace-cell.h-pivot { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.08); }
    .trace-cell.h-active { background: rgba(124,106,247,.2); border-color: var(--accent); color: var(--accent); }
    .trace-cell.h-sorted { background: rgba(0,184,148,.15); border-color: var(--easy); color: var(--easy); }
    .trace-desc { text-align: center; color: var(--text); font-size: 13px; margin-bottom: 4px; min-height: 18px; line-height: 1.4; }
    .trace-step-counter { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 14px; font-variant-numeric: tabular-nums; }
    .trace-controls { display: flex; gap: 8px; justify-content: center; }
    .trace-controls .btn { padding: 7px 16px; font-size: 12px; }
    .breakdown-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 11px; border-bottom: 1px solid var(--border); }
    .breakdown-row .complexity { font-family: 'SF Mono', monospace; font-weight: 600; min-width: 80px; }
    .breakdown-row .bar-bg { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .breakdown-row .bar-fill { height: 100%; transition: width .3s; }
    .breakdown-row .bar-fill.high { background: var(--easy); }
    .breakdown-row .bar-fill.mid { background: var(--medium); }
    .breakdown-row .bar-fill.low { background: var(--hard); }
    .breakdown-row .acc-text { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; color: var(--muted); }

    /* === solution panel (problem mode) === */
    .solution-section { margin-top: 14px; }
    .btn-show-solution {
      width: 100%; justify-content: center;
      background: rgba(74,166,255,.08); color: #4aa6ff; border: 1px solid rgba(74,166,255,.25);
    }
    .btn-show-solution:hover { background: rgba(74,166,255,.18); }
    .solution-box {
      background: var(--surface); border: 1px solid rgba(74,166,255,.3); border-radius: 10px;
      padding: 14px 16px; margin-top: 10px; line-height: 1.55;
    }
    .solution-box h4 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #4aa6ff;
      margin-bottom: 6px; font-weight: 700;
    }

    /* Animated diagram bits */

function partition(arr, lo, hi):
  pivot = arr[hi]

  { id:'sort_q8', question:'You need to sort a large linked list. Best choice?',
    options:['Quick Sort','Heap Sort','Merge Sort','Insertion Sort'],
    answer:2, explanation:'Merge Sort works naturally on linked lists — splitting and merging only need pointer manipulation, no random access.' },
  { id:'sort_q9', question:'For n = 10,000, roughly how much faster is O(n log n) than O(n²)?',
    options:['~10x faster','~100x faster','~750x faster','~10,000x faster'],
    answer:2, explanation:'n² = 100,000,000 vs n log₂ n ≈ 133,000 → about 750× fewer operations.' },
];

// ── Sort tracers ────────────────────────────────────────────────────────────
const TRACE_SAMPLE = [5, 2, 8, 1, 9, 3];

function traceInsertion(input) {
  const a = [...input];
  const states = [{ a: [...a], h: [], desc: 'Initial array' }];
  for (let i = 1; i < a.length; i++) {
    const key = a[i];
    let j = i - 1;
    states.push({ a: [...a], h: [i], desc: `i=${i}: pick key=${key}, scan left for insert spot` });
    while (j >= 0 && a[j] > key) { a[j+1] = a[j]; j--; }
    a[j+1] = key;
    states.push({ a: [...a], h: [j+1], desc: `Insert ${key} at index ${j+1}` });
  }
  states.push({ a: [...a], h: [], desc: '✓ Sorted' });
  return states;
}

function traceSelection(input) {
  const a = [...input];
  const states = [{ a: [...a], h: [], desc: 'Initial array' }];
  for (let i = 0; i < a.length - 1; i++) {
    let minIdx = i;
    for (let j = i+1; j < a.length; j++) if (a[j] < a[minIdx]) minIdx = j;
    states.push({ a: [...a], h: [minIdx], desc: `Pass ${i+1}: min in arr[${i}..] is ${a[minIdx]} at index ${minIdx}` });
    if (minIdx !== i) [a[i], a[minIdx]] = [a[minIdx], a[i]];
    states.push({ a: [...a], h: [i], desc: `Swap into position ${i}` });
  }
  states.push({ a: [...a], h: [], desc: '✓ Sorted' });
  return states;
}

function traceMerge(input) {
  const a = [...input];
  const states = [{ a: [...a], h: [], desc: 'Initial array' }];
  function rec(lo, hi) {
    if (lo >= hi) return;
    const mid = Math.floor((lo + hi) / 2);
    rec(lo, mid);
    rec(mid + 1, hi);
    const L = a.slice(lo, mid + 1), R = a.slice(mid + 1, hi + 1);
    let i = 0, j = 0, k = lo;
    while (i < L.length && j < R.length) a[k++] = L[i] <= R[j] ? L[i++] : R[j++];
    while (i < L.length) a[k++] = L[i++];
    while (j < R.length) a[k++] = R[j++];
    const span = []; for (let x = lo; x <= hi; x++) span.push(x);
    states.push({ a: [...a], h: span, desc: `Merge subarray [${lo}..${hi}]` });
  }
  rec(0, a.length - 1);
  states.push({ a: [...a], h: [], desc: '✓ Sorted' });
  return states;
}

function traceQuick(input) {
  const a = [...input];
  const states = [{ a: [...a], h: [], desc: 'Initial array' }];
  function partition(lo, hi) {
    const pivot = a[hi];
    states.push({ a: [...a], h: [hi], desc: `Partition [${lo}..${hi}], pivot=${pivot}` });
    let i = lo - 1;
    for (let j = lo; j < hi; j++) {
      if (a[j] <= pivot) { i++; [a[i], a[j]] = [a[j], a[i]]; }
    }
    [a[i+1], a[hi]] = [a[hi], a[i+1]];
    states.push({ a: [...a], h: [i+1], desc: `Pivot ${pivot} placed at final index ${i+1}` });
    return i + 1;
  }
  function rec(lo, hi) {
    if (lo < hi) { const p = partition(lo, hi); rec(lo, p-1); rec(p+1, hi); }
  }
  rec(0, a.length - 1);
  states.push({ a: [...a], h: [], desc: '✓ Sorted' });
  return states;
}

function traceHeap(input) {
  const a = [...input];
  const states = [{ a: [...a], h: [], desc: 'Initial array' }];
  const n = a.length;
  function heapify(size, i) {
    let largest = i;
    const l = 2*i + 1, r = 2*i + 2;
    if (l < size && a[l] > a[largest]) largest = l;
    if (r < size && a[r] > a[largest]) largest = r;
    if (largest !== i) { [a[i], a[largest]] = [a[largest], a[i]]; heapify(size, largest); }
  }
  for (let i = Math.floor(n/2) - 1; i >= 0; i--) heapify(n, i);
  states.push({ a: [...a], h: [], desc: 'Built max-heap' });
  for (let i = n - 1; i > 0; i--) {
    [a[0], a[i]] = [a[i], a[0]];
    heapify(i, 0);
    states.push({ a: [...a], h: [i], desc: `Extract max → arr[${i}]; heapify remaining ${i} elements` });
  }
  states.push({ a: [...a], h: [], desc: '✓ Sorted' });
  return states;
}

const TRACERS = { merge: traceMerge, quick: traceQuick, heap: traceHeap, insertion: traceInsertion, selection: traceSelection };
let traceStates = [];
let traceIdx = 0;

function initTrace(algoId) {
  traceStates = TRACERS[algoId](TRACE_SAMPLE);
  traceIdx = 0;
}

function traceNext() { if (traceIdx < traceStates.length - 1) { traceIdx++; updateTraceDOM(); } }
function tracePrev() { if (traceIdx > 0) { traceIdx--; updateTraceDOM(); } }
function traceReset() { traceIdx = 0; updateTraceDOM(); }

function traceHtml() {
  if (!traceStates.length) return '';
  const s = traceStates[traceIdx];
  const cells = s.a.map((v, i) => `<div class="trace-cell ${s.h.includes(i) ? 'h-pivot' : ''}">${v}</div>`).join('');
  return `
    <h3>Step Through · sample [${TRACE_SAMPLE.join(', ')}]</h3>
    <div class="trace-desc">${s.desc}</div>
    <div class="trace-step-counter">Step ${traceIdx + 1} of ${traceStates.length}</div>
    <div class="trace-array">${cells}</div>
    <div class="trace-controls">
      <button class="btn btn-ghost" onclick="traceReset()">↺ Reset</button>
      <button class="btn btn-ghost" onclick="tracePrev()" ${traceIdx === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn btn-primary" onclick="traceNext()" ${traceIdx === traceStates.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>`;
}

function updateTraceDOM() {
  const el = document.getElementById('traceSection');
  if (el) el.innerHTML = traceHtml();
}

// ── Timer ──────────────────────────────────────────────────────────────────
function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.45, 0.9].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.6, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.38);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.4);
    });
  } catch (e) {}
}

function syncTimerDisplay() {
  const el = document.getElementById('tNum');
  if (!el) return;
  el.textContent = fmt(secs);
  el.className = 'timer-num' + (secs <= 60 ? ' danger' : secs <= 300 ? ' warn' : '');
  document.title = running ? `${fmt(secs)} — Blind 75` : 'Blind 75 Practice';
}

function startTimer() {
  if (running) {
    clearInterval(iv); running = false;
    document.getElementById('startBtn').textContent = '▶ Resume';
    return;
  }
  running = true;
  document.getElementById('startBtn').textContent = '⏸ Pause';
  iv = setInterval(() => {
    if (secs <= 0) {
      clearInterval(iv); running = false;
      playAlarm();
      document.getElementById('startBtn').textContent = '▶ Start';
      document.title = "Time's Up! — Blind 75";
      return;
    }
    secs--;
    syncTimerDisplay();
  }, 1000);
}

function resetTimer() {
  clearInterval(iv); running = false; secs = 1200;
  syncTimerDisplay();
  const b = document.getElementById('startBtn');
  if (b) b.textContent = '▶ Start';
  document.title = 'Blind 75 Practice';
}

// ── Actions ────────────────────────────────────────────────────────────────
function selectProblem(id) { selId = id; resetTimer(); renderPanel(); renderList(); }

function toggleDone(id) {
  const val = !done.has(id);
  val ? done.add(id) : done.delete(id);
  updateProgress(); renderList(); renderPanel();
  api('/api/set-done', { id, value: val });
}

function toggleReview(id) {
  const val = !review.has(id);
  val ? review.add(id) : review.delete(id);
  renderList(); renderPanel();
  api('/api/set-review', { id, value: val });
}

function markOutcome(id, outcome) {
  const elapsed = secs < 1200 ? 1200 - secs : 0;
  const attempt = { ts: Date.now(), elapsed, outcome };
  problemData[id] = problemData[id] || {};
  problemData[id].attempts = [...(problemData[id].attempts || []), attempt];
  done.add(id);
  if (outcome !== 'solved' && !review.has(id)) review.add(id);
  updateProgress(); renderList(); renderPanel();
  api('/api/log-attempt', { id, elapsed, outcome });
  api('/api/set-done', { id, value: true });
  if (outcome !== 'solved') api('/api/set-review', { id, value: true });
}

function tryAgain(id) {
  done.delete(id);
  updateProgress(); renderList(); renderPanel();
  resetTimer();
  api('/api/set-done', { id, value: false });
}

function saveNote(id, text) {
  problemData[id] = problemData[id] || {};
  problemData[id].notes = text;
  clearTimeout(noteDebounce[id]);
  noteDebounce[id] = setTimeout(() => api('/api/save-note', { id, text }), 600);
}

function randomProblem() {
  const list = filtered();
  if (!list.length) return;
  selectProblem(list[Math.floor(Math.random() * list.length)].id);
}

// ── Attempts display ───────────────────────────────────────────────────────
function outcomeTag(o) {
  if (o === 'solved') return `<span style="color:var(--easy)">Solved</span>`;
  if (o === 'hint') return `<span style="color:var(--medium)">Needed Hint</span>`;
  if (o === 'watched') return `<span style="color:var(--hard)">Watched</span>`;
  return '';
}

function attemptsHtml(id) {
  const a = getAttempts(id);
  if (!a.length) return '';
  const solvedTimes = a.filter(x => x.outcome === 'solved').map(x => x.elapsed);
  const best = solvedTimes.length ? Math.min(...solvedTimes) : null;
  const rows = a.slice(-3).reverse().map((x, i) =>
    `<div class="attempt-item">
      <span>Attempt ${a.length - i} · ${outcomeTag(x.outcome)}</span>
      <span>${fmt(x.elapsed)} · ${new Date(x.ts).toLocaleDateString()}</span>
    </div>`
  ).join('');
  const bestStr = best !== null ? ` · Best: <span style="color:var(--easy)">${fmt(best)}</span>` : '';
  return `<div class="attempts-section">
    <div class="attempts-label">${a.length} attempt${a.length > 1 ? 's' : ''}${bestStr}</div>
    <div class="attempt-list">${rows}</div>
  </div>`;
}

// ── Render list ────────────────────────────────────────────────────────────
function isDueForSpacedReview(problemId) {
  const data = problemData[problemId] || {};
  const attempts = data.attempts || [];
  if (!attempts.length) return false;
  const lastSolved = [...attempts].reverse().find(a => a.outcome === 'solved');
  if (!lastSolved) return false;
  const days = (Date.now() - lastSolved.ts) / 86400000;
  return days >= 14;
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const d = document.getElementById('fDiff').value;
  const c = document.getElementById('fCat').value;
  const s = document.getElementById('fStatus').value;
  return problems.filter(p =>
    (d === 'All' || p.difficulty === d) &&
    (c === 'All' || p.category === c) &&
    (!q || p.name.toLowerCase().includes(q) || (p.ds && p.ds.toLowerCase().includes(q))) &&
    (s === 'All' || (s === 'Done' && done.has(p.id)) || (s === 'Not Done' && !done.has(p.id)) || (s === 'Review' && review.has(p.id)) || (s === 'Spaced Review' && isDueForSpacedReview(p.id)))
  );
}

function catMastered(items) {
  return items.filter(p => done.has(p.id)).length / items.length >= 0.8;
}

function renderCatHeader(list, cat, items) {
  const doneCount = items.filter(p => done.has(p.id)).length;
  const pct = Math.round((doneCount / items.length) * 100);
  const mastered = pct >= 80;
  const h = document.createElement('li');
  h.className = 'cat-header' + (mastered ? ' mastered' : '');
  h.innerHTML = `
    <span class="cat-name">${mastered ? '✓ ' : ''}${cat}</span>
    <span class="cat-pct">${doneCount}/${items.length}</span>
    <span class="cat-bar"><span class="cat-bar-fill" style="width:${pct}%"></span></span>`;
  list.appendChild(h);
}

function renderProblemItem(list, p) {
  const li = document.createElement('li');
  li.className = 'problem-item' + (p.id === selId ? ' active' : '') + (done.has(p.id) ? ' done' : '');
  li.innerHTML = `
    <div class="chk ${done.has(p.id) ? 'on' : ''}" onclick="event.stopPropagation();toggleDone(${p.id})">${done.has(p.id) ? '✓' : ''}</div>
    <div class="p-info">
      <div class="p-name">${p.name}${p.premium ? ' 🔒' : ''}</div>
      <div class="p-sub">${p.ds}</div>
    </div>
    ${review.has(p.id) ? '<div class="review-dot" title="Marked for review"></div>' : ''}
    ${isDueForSpacedReview(p.id) ? '<div class="spaced-dot" title="Due for spaced review (solved 14+ days ago)"></div>' : ''}
    <div class="dot ${p.difficulty}"></div>`;
  li.addEventListener('click', () => selectProblem(p.id));
  list.appendChild(li);
}

function renderList() {
  const list = document.getElementById('pList');
  list.innerHTML = '';
  const grouped = {};
  filtered().forEach(p => { (grouped[p.category] = grouped[p.category] || []).push(p); });

  const inProgress = [], mastered = [];
  Object.entries(grouped).forEach(([cat, items]) => {
    (catMastered(items) ? mastered : inProgress).push([cat, items]);
  });

  inProgress.forEach(([cat, items]) => {
    renderCatHeader(list, cat, items);
    items.forEach(p => renderProblemItem(list, p));
  });

  if (mastered.length) {
    const div = document.createElement('li');
    div.className = 'cat-divider';
    div.textContent = `✓ Mastered (${mastered.length})`;
    list.appendChild(div);
    mastered.forEach(([cat, items]) => {
      renderCatHeader(list, cat, items);
      items.forEach(p => renderProblemItem(list, p));
    });
  }

  updateProgress();
}

async function loadSheets(id) {
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`;
  const text = await (await fetch(url)).text();
  const m = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!m) throw new Error('parse');
  const { table } = JSON.parse(m[1]);
  const cols = table.cols.map(c => c.label.toLowerCase().trim());
  const col = l => cols.indexOf(l);
  return table.rows.map((row, i) => {
    const v = idx => (idx >= 0 && row.c[idx]) ? String(row.c[idx].v) : '';
    const lcRaw = v(col('leetcode url'));
    const slug = lcRaw.replace(/https?:\/\/leetcode\.com\/problems\//, '').replace(/\/$/, '') || `problem-${i + 1}`;
    return {
      id: i + 1,
      name: v(col('name')) || v(col('problem name')) || `Problem ${i + 1}`,
      slug, difficulty: v(col('difficulty')) || 'Medium',
      category: v(col('category')) || 'Uncategorized',
      ds: v(col('data structure')) || v(col('core data structure')) || '',
      youtubeUrl: v(col('youtube url')) || v(col('youtube')) || '',
      premium: /true/i.test(v(col('premium'))),
    };
  }).filter(p => p.name && !p.name.startsWith('Problem ') || p.slug !== `problem-${i + 1}`);
}

    details: [
      { heading: 'What it is', body: `<p>Big-O notation describes how an algorithm's running time (or memory) grows as the input gets larger. It strips away constants and lower-order terms to focus on what really matters at scale: the <strong>growth shape</strong>.</p>
<p>If your algorithm runs in <code>3n + 50</code> steps on input of size n, we call it <code>O(n)</code> — the constants and small terms don't matter at scale. What matters is that doubling n doubles your time.</p>` },
      { heading: 'How it works', body: `<p>Read your code and ask: "if I double the input, what happens to the work?"</p>
<p>• A single loop over n items: <code>O(n)</code> — doubling n doubles the loops.<br>• Two nested loops over the same n: <code>O(n²)</code> — doubling n quadruples the work.<br>• A loop that halves the search range each step (binary search): <code>O(log n)</code>.<br>• Recursion that branches into two calls without caching: typically <code>O(2ⁿ)</code>.<br>• Generating all subsets of n elements: exactly <code>O(2ⁿ)</code>. All permutations: <code>O(n!)</code>.</p>
<p>Ranked from fastest to slowest: <code>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)</code>.</p>` },
      { heading: 'When to reach for it', body: `<p>Always. Every solution you propose in an interview should come with its time and space complexity. If your first idea is <code>O(n²)</code>, the interviewer will usually ask <em>"can you do better?"</em></p>
<p>The two most common improvements: <strong>add a hash map</strong> (turns O(n²) into O(n) for "have I seen this?" patterns) or <strong>sort first</strong> (turns O(n²) into O(n log n) and unlocks binary search or two-pointer).</p>` }

<p><strong>Optimal:</strong> walk once, store each value's index in a hash map. For each new element, check if its complement is already stored. The lookup is <code>O(1)</code>, so total is <code>O(n)</code> time, <code>O(n)</code> space.</p>`,
        code: `# O(n²) brute force

        problem: 'Find the minimum element in a rotated sorted array (or simply: find a value in a sorted array).',
        approach: `<p>Each comparison eliminates half the remaining range. After 1 step, n/2 candidates left. After 2 steps, n/4. After k steps, n/2ᵏ. You finish when 2ᵏ ≥ n, so k ≈ log₂(n).</p>
<p>That's why you see <code>log n</code> in the analysis — the input is halved per step.</p>`,
        code: `def binary_search(arr, target):

        if arr[mid] == target: return mid
        if arr[mid] < target: lo = mid + 1

    return -1`,
        time: 'O(log n)', space: 'O(1)',
        why: 'Anywhere you can split a problem in half each step, you get a logarithmic factor.' },
      { title: 'Bubble Sort — quadratic time', problemId: null,
        problem: 'Sort an array by repeatedly swapping adjacent out-of-order pairs.',
        approach: `<p>Outer loop runs n times. Inner loop runs up to n times. Worst case work is roughly <code>n × n / 2 = O(n²)</code>.</p>
<p>For n = 1,000 → 1,000,000 operations. For n = 10,000 → 100,000,000. Compare to merge sort's <code>O(n log n)</code>: 10,000 · 13 ≈ 130,000 — about 750× less work at the same input size.</p>`,
        code: `def bubble_sort(arr):

      { heading: 'What it is', body: `<p>Sorting puts elements in order. Once sorted, an array unlocks binary search, two-pointer techniques, and greedy strategies. Knowing when to sort and which sort to use is one of the most reliably-rewarded interview skills.</p>
<p>You need to know <strong>five algorithms</strong>: Merge Sort, Quick Sort, Heap Sort (O(n log n)), Insertion Sort, Selection Sort (O(n²)).</p>` },
      { heading: 'How it works', body: `<p><strong>Merge Sort</strong> — divide and conquer. Split the array in half recursively, sort each half, merge the sorted halves. The merge step is the workhorse. Stable. <code>O(n log n)</code> guaranteed. Uses <code>O(n)</code> extra space.</p>
<p><strong>Quick Sort</strong> — pick a pivot, partition into "less than pivot" and "greater than pivot," recurse. Average <code>O(n log n)</code> in place. Worst <code>O(n²)</code> if pivots are bad. Not stable.</p>
<p><strong>Heap Sort</strong> — build a max-heap (<code>O(n)</code>), then extract n times at <code>O(log n)</code> each. The only <code>O(n log n)</code> sort with <code>O(1)</code> space. Not stable, less cache-friendly than Quick Sort.</p>
<p><strong>Insertion Sort</strong> — like sorting cards in your hand. <code>O(n²)</code> worst case but <code>O(n)</code> on nearly-sorted data, and stable. Real production sorts (Timsort) use it below ~16 elements.</p>
<p><strong>Selection Sort</strong> — find the min of the unsorted part, swap to the front, repeat. Exactly n−1 swaps regardless of input. Useful when writes are expensive.</p>` },
      { heading: 'When to reach for it', body: `<p>If your problem becomes obvious after sorting (e.g. "find duplicates," "merge intervals," "k closest elements"), <strong>just sort first</strong>. The <code>O(n log n)</code> cost is usually dwarfed by the savings.</p>
<p>You almost never implement these from scratch in an interview — call the language's built-in sort. But you must know each algorithm's complexity, stability, space, and when each one wins.</p>` }

        code: `def merge_sort(arr):
    if len(arr) <= 1: return arr
    mid = len(arr) // 2
    left = merge_sort(arr[:mid])
    right = merge_sort(arr[mid:])
    return merge(left, right)

def merge(L, R):
    out, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]: out.append(L[i]); i += 1
        else:            out.append(R[j]); j += 1
    return out + L[i:] + R[j:]`,

      { title: 'Quick Sort — fast in practice', problemId: null,
        problem: 'Sort in place using partitioning around a pivot.',
        approach: `<p>Pick a pivot. Walk the array, swap so that everything before some boundary is ≤ pivot, everything after is > pivot. Place the pivot between them — it's now in its final position. Recurse on each side.</p>
<p>The classic worst case: array is already sorted and you pick the last element as pivot. Each partition removes one element → n recursion levels → O(n²). Mitigate with random or median-of-three pivot.</p>`,
        code: `def quick_sort(arr, lo, hi):
    if lo < hi:
        p = partition(arr, lo, hi)
        quick_sort(arr, lo, p - 1)
        quick_sort(arr, p + 1, hi)

def partition(arr, lo, hi):
    pivot, i = arr[hi], lo - 1
    for j in range(lo, hi):
        if arr[j] <= pivot:
            i += 1
            arr[i], arr[j] = arr[j], arr[i]
    arr[i+1], arr[hi] = arr[hi], arr[i+1]
    return i + 1`,
        time: 'Avg O(n log n) · Worst O(n²)', space: 'O(log n) call stack',
        why: 'Cache-friendly and in-place — usually the fastest in practice. Just don\'t use a fixed pivot on adversarial input.' },
      { title: 'Insertion Sort — best on small inputs', problemId: null,
        problem: 'Sort by building the sorted prefix one element at a time.',
        approach: `<p>For each element, slide it left until it sits in the right place. On a nearly-sorted array, each element only moves a little, so total work is <code>O(n)</code> — better than any O(n log n) sort because the constant factor is so small.</p>
<p>That's why Timsort (Python, JS) uses Insertion Sort for small chunks (under ~16 elements) before merging.</p>`,
        code: `def insertion_sort(arr):
    for i in range(1, len(arr)):

        while j >= 0 and arr[j] > key:
            arr[j + 1] = arr[j]
            j -= 1
        arr[j + 1] = key`,

        code: `from collections import Counter
def min_window(s, t):
    if not t or not s: return ''
    need = Counter(t)
    missing = len(t)
    L, best_L, best_len = 0, 0, float('inf')

        while missing == 0:

    return '' if best_len == float('inf') else s[best_L:best_L + best_len]`,

        count[s[R]] = count.get(s[R], 0) + 1
        max_count = max(max_count, count[s[R]])
        if R - L + 1 - max_count > k:
            count[s[L]] -= 1
            L += 1
        best = max(best, R - L + 1)
    return best`,

<p>• A <strong>base case</strong> that stops the recursion (the smallest problem, solved directly).<br>• A <strong>recursive step</strong> that reduces the problem toward the base case.</p>
<p>It's mathematical induction in code: solve the trivial case, then build bigger cases from smaller ones.</p>` },
      { heading: 'How it works', body: `<p>Each call adds a frame to the call stack. The call stack grows downward as you recurse, then unwinds back up as base cases return.</p>
<p>For <code>factorial(4)</code>: 4 calls 3, 3 calls 2, 2 calls 1 (base case → returns 1). Then the stack unwinds: 2 returns 2, 3 returns 6, 4 returns 24.</p>
<p>Recursion uses <strong>O(depth)</strong> stack space. Most languages crash around 10,000–100,000 levels deep — for very deep recursion you might need to convert to iteration with an explicit stack.</p>` },
      { heading: 'When to reach for it', body: `<p>Recursion shines for naturally recursive structures — trees, nested data, divide-and-conquer. Tree traversal, merge sort, backtracking — all simpler as recursion than as loops.</p>

  { id: 'bit-manip', section: 'Foundations', title: 'Bit Manipulation', estMin: 10, optional: true,
    summary: 'Operate on individual bits — fast tricks for sets, parity, and powers of 2.',
    details: [
      { heading: 'What it is', body: `<p>Bit manipulation operates on the binary representation of numbers — the actual 0s and 1s in memory. The three core operators:</p>
<p>• <code>AND (&)</code> — bit set only if both inputs are 1. Used to <em>check</em> or <em>clear</em> bits.<br>• <code>OR (|)</code> — bit set if either input is 1. Used to <em>set</em> bits.<br>• <code>XOR (^)</code> — bit set if exactly one input is 1. Used to <em>flip</em> bits.</p>` },
      { heading: 'How it works', body: `<p>The killer property of <strong>XOR</strong>: <code>a ^ a = 0</code> and <code>a ^ 0 = a</code>. Pairs cancel; uniques survive. XORing every element of an array where each appears twice except one leaves that unique element.</p>
<p><code>n & (n − 1)</code> clears the lowest set bit. Useful for counting set bits — repeatedly apply until n = 0.</p>
<p>Bit shifts: <code>n &lt;&lt; k</code> = n × 2ᵏ, <code>n &gt;&gt; k</code> = n / 2ᵏ. Faster than arithmetic on most CPUs. Check if n is a power of 2: <code>n &gt; 0 && (n & (n − 1)) == 0</code>.</p>` },
      { heading: 'When to reach for it', body: `<p>This topic is <strong>optional</strong> — only 5 of the 75 problems are pure bit manipulation. Skip unless your target company is known for systems problems, or come back after the core topics.</p>
<p>If a problem mentions "without using extra space" or "find the unique element," XOR is often the trick.</p>` }
    ],
    examples: [
      { title: 'Single Number — XOR cancels pairs', problemId: 14,
        problem: 'Every element appears twice except one. Find the unique element. (Variant: Missing Number.)',
        approach: `<p>XOR all elements together. Pairs cancel (<code>x ^ x = 0</code>); the lone element survives. <code>O(n)</code> time, <code>O(1)</code> space.</p>`,
        code: `def find_unique(nums):
    result = 0
    for n in nums:
        result ^= n
    return result

# [4, 1, 2, 1, 2] → 4^1^2^1^2 = 4`,
        time: 'O(n)', space: 'O(1)',
        why: 'No hash map needed. XOR\'s self-cancellation gives constant space.' },
      { title: 'Number of 1 Bits — clear-lowest-set-bit trick', problemId: 12,
        problem: 'Count the number of 1 bits in an unsigned integer.',
        approach: `<p>Naive: shift right and check the LSB n times → 32 iterations. Smarter: <code>n & (n − 1)</code> clears the lowest set bit. Iterate until n = 0; count iterations.</p>
<p>For a number with k set bits, this loops only k times — much faster on sparse inputs.</p>`,
        code: `def count_ones(n):
    count = 0
    while n:
        n &= n - 1   # clears lowest set bit
        count += 1
    return count

# 0b1011 → 0b1010 → 0b1000 → 0 (3 iters, 3 ones)`,

        why: 'A trick worth memorizing — comes up often in bit-counting and DP-on-bits problems.' }
    ],

      { heading: 'How it works', body: `<p>The cost is at the boundaries. Inserting at the front is <code>O(n)</code> because every element after must shift right. Resizing a dynamic array is <code>O(n)</code> for the copy, but <em>amortized</em> over many inserts the cost per push is still <code>O(1)</code>.</p>
<p>In-place modifications keep space at <code>O(1)</code>. Building a new output array costs <code>O(n)</code> extra.</p>` },

<p>• <strong>Hash map</strong> for "is this seen?" questions<br>• <strong>Two pointers</strong> for sorted arrays<br>• <strong>Sliding window</strong> for contiguous-subarray questions<br>• <strong>Sort first</strong> for any-order questions</p>` }

<p>Single pass — no need to consider every (buy, sell) pair.</p>`,
        code: `def max_profit(prices):

        code: `def is_palindrome(s):
    L, R = 0, len(s) - 1
    while L < R:
        while L < R and not s[L].isalnum(): L += 1
        while L < R and not s[R].isalnum(): R -= 1
        if s[L].lower() != s[R].lower():

        L += 1; R -= 1
    return True`,

  { id: 'linked-list', section: 'Data Structures', title: 'Linked Lists', estMin: 12,
    summary: 'Chains of nodes pointing to the next — easy to insert, hard to index.',
    details: [
      { heading: 'What it is', body: `<p>A linked list is a chain of nodes. Each node holds a value and a <code>next</code> pointer to the following node. The last node's <code>next</code> is <code>null</code>.</p>` },
      { heading: 'How it works', body: `<p>Insertion at the head is <code>O(1)</code> (no shifting), but indexing is <code>O(n)</code> — you must walk the chain to reach element i. Great when you do many insertions/removals at known spots; bad when you need random access.</p>
<p>Three techniques you'll see repeatedly:</p>
<p>• <strong>Dummy head</strong> — prepend a sentinel node so you don't have to special-case "removing the head."<br>• <strong>Fast/slow pointer (Floyd's)</strong> — one pointer moves 2× the other. Find middle, detect cycle, find cycle start.<br>• <strong>Reverse in place</strong> — walk with prev/curr/next, flipping each pointer.</p>` },
      { heading: 'When to reach for it', body: `<p>You don't usually <em>choose</em> linked lists in interviews — you're given one. The interviewer wants to see if you can manipulate pointers without losing data or creating cycles.</p>
<p>If you find yourself wanting to "go back" or "look back N nodes," you usually need either a <strong>two-pointer trick</strong> (gap pointers) or a <strong>reverse-in-place</strong>.</p>` }
    ],
    examples: [
      { title: 'Reverse Linked List — three-pointer flip', problemId: 40,
        problem: 'Reverse a singly linked list.',
        approach: `<p>Walk with prev = null and curr = head. At each step, save curr.next, point curr.next at prev, advance prev to curr, advance curr to the saved next. When curr is null, prev is the new head.</p>`,
        code: `def reverse_list(head):
    prev, curr = None, head
    while curr:
        nxt = curr.next
        curr.next = prev
        prev = curr
        curr = nxt
    return prev`,
        time: 'O(n)', space: 'O(1)',
        why: 'The three-pointer dance shows up in many list problems. Burn it into muscle memory.' },
      { title: 'Linked List Cycle — Floyd\'s tortoise and hare', problemId: 41,
        problem: 'Determine if a linked list has a cycle.',
        approach: `<p>Two pointers: slow advances 1, fast advances 2. If there\'s a cycle, fast will eventually meet slow. If fast hits null, there\'s no cycle.</p>
<p>The math: in a cycle, fast gains 1 step on slow per iteration, so they meet within n iterations.</p>`,
        code: `def has_cycle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow is fast:
            return True
    return False`,
        time: 'O(n)', space: 'O(1)',
        why: 'Constant space is the killer feature. A hash-set of seen nodes also works but uses O(n) space.' },
      { title: 'Merge Two Sorted Lists — pointer walk with dummy head', problemId: 42,
        problem: 'Merge two sorted linked lists into one sorted list.',
        approach: `<p>Use a dummy head to avoid edge-case branching. Walk both lists, attach the smaller node to the tail, advance.</p>`,
        code: `def merge_two(l1, l2):
    dummy = tail = ListNode()
    while l1 and l2:
        if l1.val <= l2.val:
            tail.next, l1 = l1, l1.next
        else:
            tail.next, l2 = l2, l2.next
        tail = tail.next
    tail.next = l1 or l2

        code: `def num_islands(grid):
    if not grid: return 0
    rows, cols = len(grid), len(grid[0])

    def dfs(r, c):

        code: `from collections import deque, defaultdict
def can_finish(n, prereqs):
    graph = defaultdict(list)
    indeg = [0] * n

        indeg[a] += 1
    q = deque(i for i in range(n) if indeg[i] == 0)
    seen = 0
    while q:
        node = q.popleft()
        seen += 1
        for nei in graph[node]:
            indeg[nei] -= 1
            if indeg[nei] == 0:
                q.append(nei)

def clone_graph(node):
    if not node: return None
    clones = {node: Node(node.val)}
    q = deque([node])
    while q:

        for nei in cur.neighbors:
            if nei not in clones:
                clones[nei] = Node(nei.val)
                q.append(nei)
            clones[cur].neighbors.append(clones[nei])
    return clones[node]`,

        code: `def count_components(n, edges):
    parent = list(range(n))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]   # path compression
            x = parent[x]
        return x

    def union(a, b):
        ra, rb = find(a), find(b)
        if ra != rb: parent[ra] = rb

    for a, b in edges:
        union(a, b)
    return len(set(find(i) for i in range(n)))`,

    for r in range(1, rows):
        for c in range(1, cols):
            if matrix[r][0] == 0 or matrix[0][c] == 0:
                matrix[r][c] = 0
    if first_row:
        for c in range(cols): matrix[0][c] = 0
    if first_col:
        for r in range(rows): matrix[r][0] = 0`,
        time: 'O(m·n)', space: 'O(1)',
        why: 'Reusing the first row and column as flags is the classic trick to get O(1) extra space.' },
      { title: 'Rotate Image — transpose then reverse rows', problemId: 48,
        problem: 'Rotate an n × n matrix 90° clockwise in place.',
        approach: `<p>Two-step transformation: (1) transpose — swap M[i][j] with M[j][i] for i &lt; j. (2) Reverse each row. Both are in place; total O(n²).</p>`,
        code: `def rotate(matrix):
    n = len(matrix)
    for i in range(n):
        for j in range(i + 1, n):
            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]
    for row in matrix:
        row.reverse()`,
        time: 'O(n²)', space: 'O(1)',

        problem: 'Return all elements of a matrix in spiral order (right, down, left, up, repeat).',
        approach: `<p>Maintain top/bottom/left/right boundaries. Walk one layer at a time and shrink the boundaries inward.</p>`,
        code: `def spiral_order(matrix):
    out, top, bot = [], 0, len(matrix) - 1
    left, right = 0, len(matrix[0]) - 1
    while top <= bot and left <= right:
        for c in range(left, right + 1): out.append(matrix[top][c])
        top += 1
        for r in range(top, bot + 1): out.append(matrix[r][right])
        right -= 1
        if top <= bot:
            for c in range(right, left - 1, -1): out.append(matrix[bot][c])
            bot -= 1
        if left <= right:
            for r in range(bot, top - 1, -1): out.append(matrix[r][left])

    return out`,

  { id: 'binary-search', section: 'Patterns', title: 'Binary Search', estMin: 10,

      { heading: 'How it works', body: `<p>Standard template:</p>
<p><code>lo = 0, hi = n − 1</code>. Loop while <code>lo ≤ hi</code>. <code>mid = lo + (hi − lo) // 2</code> (avoids overflow). Compare arr[mid] to target. If equal, return. If less, <code>lo = mid + 1</code>. Else <code>hi = mid − 1</code>.</p>
<p>The pattern <strong>generalizes beyond sorted-array search</strong>. Any monotonic predicate — "given x, does it work?" where yes/no flips at some boundary — can be binary searched on the value space.</p>` },
      { heading: 'When to reach for it', body: `<p>Sorted array → search for value: classic binary search.</p>
<p>"Smallest/largest x such that f(x) is true" where f is monotonic → binary search on values, not indices.</p>
<p>Examples: capacity to ship in d days, Koko eating bananas, find peak in mountain array. Whenever you can phrase it as "is x feasible?", you can binary search.</p>` }

      { title: 'Classic binary search — find target in sorted array', problemId: null,

        approach: `<p>Standard template. Memorize this exactly — small variations cause infinite loops.</p>`,
        code: `def binary_search(arr, target):
    lo, hi = 0, len(arr) - 1
    while lo <= hi:
        mid = lo + (hi - lo) // 2
        if arr[mid] == target: return mid
        if arr[mid] < target: lo = mid + 1
        else: hi = mid - 1
    return -1`,
        time: 'O(log n)', space: 'O(1)',
        why: 'The template every other binary-search problem builds on. Get the boundary conditions right.' },
      { title: 'Search in Rotated Sorted Array — one half is always sorted', problemId: 8,
        problem: 'Given a sorted array rotated at some pivot, find the target.',
        approach: `<p>At each step, one of [lo..mid] or [mid..hi] is sorted. Check which by comparing arr[mid] to arr[lo]. If target is in the sorted half, search there; otherwise search the other.</p>`,
        code: `def search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = lo + (hi - lo) // 2
        if nums[mid] == target: return mid
        if nums[lo] <= nums[mid]:        # left half sorted
            if nums[lo] <= target < nums[mid]:
                hi = mid - 1
            else:
                lo = mid + 1
        else:                             # right half sorted
            if nums[mid] < target <= nums[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
    return -1`,
        time: 'O(log n)', space: 'O(1)',
        why: 'The trick: in a rotated sorted array, at least one half is still sorted. Use that half\'s endpoints to decide where to look.' },
      { title: 'Find Minimum in Rotated Sorted Array — narrowing toward the pivot', problemId: 7,

        approach: `<p>Compare arr[mid] to arr[hi]. If arr[mid] &gt; arr[hi], the min is to the right of mid (<code>lo = mid + 1</code>). Otherwise it\'s mid or to the left (<code>hi = mid</code>). Loop until lo = hi.</p>`,
        code: `def find_min(nums):
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        mid = lo + (hi - lo) // 2
        if nums[mid] > nums[hi]:
            lo = mid + 1
        else:
            hi = mid
    return nums[lo]`,
        time: 'O(log n)', space: 'O(1)',
        why: 'Note <code>while lo &lt; hi</code> (not ≤) and <code>hi = mid</code> (not mid - 1). Different invariant for "find boundary" vs "find target."' }

  { id: 'bfs-dfs', section: 'Patterns', title: 'BFS vs DFS', estMin: 14,

      { heading: 'What it is', body: `<p>Two strategies for walking a tree or graph:</p>
<p>• <strong>BFS</strong> uses a queue, visits closest neighbors first — level by level.<br>• <strong>DFS</strong> uses recursion (or a stack), goes deep before wide.</p>
<p>Same data structure, completely different traversal order.</p>` },
      { heading: 'How it works', body: `<p><strong>BFS</strong>: visit start, enqueue neighbors, dequeue next, repeat. The first time you reach a node is via the shortest path (in unweighted graphs).</p>
<p><strong>DFS</strong>: visit start, recurse into one neighbor and explore everything reachable, then return to try the next neighbor. Natural for trees, cycle detection, "explore all paths."</p>
<p>On a tree {1, [2, [4, 5]], [3, [6, 7]]}: BFS visits 1, 2, 3, 4, 5, 6, 7. DFS pre-order: 1, 2, 4, 5, 3, 6, 7.</p>` },
      { heading: 'When to reach for it', body: `<p><strong>Shortest path</strong> or minimum steps in unweighted graph → <strong>BFS</strong>.<br><strong>Connectivity, cycle detection, all paths</strong> → <strong>DFS</strong>.<br><strong>Topological sort</strong> → either works (Kahn\'s = BFS, post-order = DFS).</p>
<p>Memory: DFS uses O(depth) stack, BFS uses O(width) queue. On a deep skinny tree, DFS can overflow. On a wide tree, BFS\'s queue can balloon.</p>` }

    examples: [
      { title: 'BFS on a binary tree — level order', problemId: 64,

        approach: `<p>Queue holds the current level\'s nodes. Capture <code>len(queue)</code> at the start of each iteration to group siblings; dequeue exactly that many.</p>`,
        code: `from collections import deque
def level_order(root):
    if not root: return []
    result, q = [], deque([root])
    while q:
        level = []
        for _ in range(len(q)):
            node = q.popleft()
            level.append(node.val)
            if node.left: q.append(node.left)
            if node.right: q.append(node.right)
        result.append(level)
    return result`,
        time: 'O(n)', space: 'O(n)',
        why: 'The <code>len(q)</code> snapshot at the top of each iteration is the trick — it groups nodes by level.' },
      { title: 'DFS — Maximum Depth (recursive)', problemId: 60,
        problem: 'Find the maximum depth of a binary tree.',
        approach: `<p>Recurse on left and right; depth = 1 + max(left, right). Base case: null → 0.</p>`,
        code: `def max_depth(root):

        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))`,

        why: 'Depth-first feels natural for tree problems because the recursion follows the tree shape.' },
      { title: 'BFS shortest path — Word Ladder style', problemId: null,

        approach: `<p>BFS over words. Each word\'s neighbors are words differing by one letter. Distance = number of BFS levels needed to reach end.</p>`,
        code: `from collections import deque
def ladder_length(begin, end, word_list):
    words = set(word_list)
    if end not in words: return 0
    q = deque([(begin, 1)])
    while q:
        word, length = q.popleft()
        if word == end: return length
        for i in range(len(word)):
            for c in 'abcdefghijklmnopqrstuvwxyz':
                nxt = word[:i] + c + word[i+1:]
                if nxt in words:
                    words.remove(nxt)   # mark visited
                    q.append((nxt, length + 1))
    return 0`,
        time: 'O(L · 26 · n)', space: 'O(n)',
        why: 'Shortest path in unweighted graph → BFS. Always.' },
      { title: 'DFS — Number of Islands', problemId: 30,
        problem: 'Count connected groups of \'1\'s in a 2D grid.',
        approach: `<p>For each unvisited \'1\', DFS to mark its whole component. Count how many DFS starts.</p>`,
        code: `def num_islands(grid):
    rows, cols, count = len(grid), len(grid[0]), 0
    def dfs(r, c):
        if r < 0 or r >= rows or c < 0 or c >= cols or grid[r][c] != '1':
            return
        grid[r][c] = '0'
        dfs(r+1, c); dfs(r-1, c); dfs(r, c+1); dfs(r, c-1)
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == '1':
                dfs(r, c); count += 1
    return count`,
        time: 'O(m·n)', space: 'O(m·n) recursion',
        why: 'Connectivity in a grid → DFS marks the entire component. Each cell visited once.' }
    ],
    gotchas: [
      'BFS in trees needs a queue, not a stack. Mixing them up gives DFS-like order.',

    code: { lang: 'Python', explain: 'BFS uses a queue and visits level by level. DFS uses recursion (or a stack) and goes deep first.',
snippet: `from collections import deque

def bfs(root):                          # level-order

def dfs(node):                          # pre-order

    takeaways: [

  { id: 'backtracking', section: 'Patterns', title: 'Backtracking', estMin: 14,
    summary: 'Try a choice → recurse → undo. Solves combinatorial search problems.',
    details: [
      { heading: 'What it is', body: `<p>Backtracking is recursive search where you make a choice, recurse, and then <strong>undo the choice</strong> if it doesn't pan out. The pattern: <em>choose → explore → un-choose</em>.</p>
<p>Maintain a partial solution (often a list called <code>path</code>). The "undo" step is what distinguishes backtracking from naive recursion.</p>` },
      { heading: 'How it works', body: `<p>Template:</p>
<p><code>def backtrack(state):<br>&nbsp;&nbsp;if is_solution(state): record(state); return<br>&nbsp;&nbsp;for choice in choices(state):<br>&nbsp;&nbsp;&nbsp;&nbsp;if not valid(choice, state): continue&nbsp;&nbsp;# prune<br>&nbsp;&nbsp;&nbsp;&nbsp;apply(choice, state)<br>&nbsp;&nbsp;&nbsp;&nbsp;backtrack(state)<br>&nbsp;&nbsp;&nbsp;&nbsp;undo(choice, state)</code></p>
<p><strong>Pruning is critical.</strong> Without it, you walk the entire decision tree and pay O(2ⁿ) or O(n!). With aggressive pruning, exponential algorithms often run "fast enough" in practice.</p>` },
      { heading: 'When to reach for it', body: `<p><strong>Combinatorial problems</strong>: subsets, permutations, combinations, N-Queens, Sudoku.</p>
<p><strong>Grid path problems</strong> with a "must visit each cell at most once" constraint: Word Search.</p>
<p><strong>"Find all valid X"</strong> where X is a structure with constraints: parentheses generation, palindrome partitioning.</p>
<p>If the problem says "all," "every," or has a small input (n ≤ 20), backtracking is a strong default.</p>` }
    ],
    examples: [
      { title: 'Subsets — include or exclude each element', problemId: null,
        problem: 'Generate all 2ⁿ subsets of a set.',
        approach: `<p>At each index, try two choices: include nums[i] in the path, or skip it. After both branches recurse, the snapshot is taken at the leaf level (when index reaches n).</p>`,
        code: `def subsets(nums):
    result, path = [], []
    def backtrack(i):
        if i == len(nums):
            result.append(path[:])   # snapshot
            return
        path.append(nums[i])
        backtrack(i + 1)
        path.pop()                    # un-choose
        backtrack(i + 1)
    backtrack(0)
    return result`,
        time: 'O(n · 2ⁿ)', space: 'O(n · 2ⁿ)',
        why: 'The cleanest backtracking template — two binary choices per element. The pop is the un-choose.' },
      { title: 'Permutations — try each unused element', problemId: null,
        problem: 'Generate all n! permutations of a list.',
        approach: `<p>Track used elements with a boolean array. At each level, loop through all n choices, skip used ones, mark used, recurse, unmark.</p>`,
        code: `def permute(nums):
    result, path, used = [], [], [False] * len(nums)
    def backtrack():
        if len(path) == len(nums):
            result.append(path[:])
            return
        for i in range(len(nums)):
            if used[i]: continue
            used[i] = True
            path.append(nums[i])
            backtrack()
            path.pop()
            used[i] = False
    backtrack()
    return result`,
        time: 'O(n · n!)', space: 'O(n)',
        why: 'Permutations have n! leaves but the tree is wider, not deeper than 2ⁿ. The "used" array is the standard trick to avoid duplicates.' },
      { title: 'Word Search — DFS with backtracking on a grid', problemId: 49,
        problem: 'Determine if a word can be constructed from sequentially adjacent grid cells.',
        approach: `<p>Try DFS from each cell. Mark visited cells (mutate the grid temporarily); recurse on neighbors that match the next char; un-mark on return.</p>`,
        code: `def exist(board, word):
    rows, cols = len(board), len(board[0])
    def dfs(r, c, i):
        if i == len(word): return True
        if r < 0 or r >= rows or c < 0 or c >= cols: return False
        if board[r][c] != word[i]: return False
        save, board[r][c] = board[r][c], '#'
        found = (dfs(r+1, c, i+1) or dfs(r-1, c, i+1) or
                 dfs(r, c+1, i+1) or dfs(r, c-1, i+1))
        board[r][c] = save           # un-mark
        return found
    for r in range(rows):
        for c in range(cols):
            if dfs(r, c, 0): return True
    return False`,
        time: 'O(m · n · 4^L)', space: 'O(L)',
        why: 'Mutating the grid as a "visited" marker is the clean trick. Restore on return — that\'s the backtrack step.' },
      { title: 'Combination Sum — repeat-allowed picking', problemId: null,
        problem: 'Find all unique combinations of candidates that sum to target. Each can be used unlimited times.',
        approach: `<p>Sort candidates. At each step, try each candidate ≥ the last picked (to avoid duplicate combinations). Stop when target reaches 0; prune if it goes negative.</p>`,
        code: `def combination_sum(candidates, target):
    candidates.sort()
    result, path = [], []
    def backtrack(start, remaining):
        if remaining == 0:
            result.append(path[:])
            return
        for i in range(start, len(candidates)):
            if candidates[i] > remaining: break   # prune
            path.append(candidates[i])
            backtrack(i, remaining - candidates[i])  # i, not i+1
            path.pop()
    backtrack(0, target)
    return result`,
        time: 'O(N^(target/min))', space: 'O(target/min)',
        why: 'The <code>start</code> parameter prevents duplicate combinations. Sorting + early break is the pruning that makes this practical.' }
    ],

<p>Each index is pushed once and popped once → total <code>O(n)</code>. The trick: you discard candidates that are dominated.</p>` },

        approach: `<p>Decreasing deque of indices. For each new i: pop the front if it\'s out of window (i − k); pop from back while <code>arr[back] ≤ arr[i]</code>; push i. Once i ≥ k − 1, record <code>arr[deque[0]]</code>.</p>`,
        code: `from collections import deque
def max_sliding_window(nums, k):
    dq, out = deque(), []
    for i, n in enumerate(nums):
        while dq and dq[0] <= i - k:
            dq.popleft()
        while dq and nums[dq[-1]] <= n:
            dq.pop()
        dq.append(i)
        if i >= k - 1:
            out.append(nums[dq[0]])
    return out`,
        time: 'O(n)', space: 'O(k)',

        approach: `<p>Compute prefix sums. Maintain an <strong>increasing</strong> deque of prefix indices. For each j: while prefix[j] − prefix[front] ≥ K, that\'s a valid pair — record length j − front and pop front. Then pop from back while prefix[back] ≥ prefix[j] (back can never be a useful left-end if we have a smaller one).</p>`,
        code: `from collections import deque
def shortest_subarray(nums, k):
    n = len(nums)
    prefix = [0] * (n + 1)
    for i, x in enumerate(nums): prefix[i+1] = prefix[i] + x
    dq = deque()
    best = n + 1
    for j in range(n + 1):
        while dq and prefix[j] - prefix[dq[0]] >= k:
            best = min(best, j - dq.popleft())
        while dq and prefix[dq[-1]] >= prefix[j]:
            dq.pop()
        dq.append(j)
    return best if best <= n else -1`,

        why: 'Hard-tier classic. Sliding window alone fails because of negatives — monotonic deque on prefix sums handles them.' }

  { id: 'segment-tree', section: 'Data Structures', title: 'Segment Trees', estMin: 18, advanced: true,

<p>For a Fenwick (Binary Indexed) tree variant: simpler code, less generic, only supports prefix-aggregable operations like sum.</p>` },
      { heading: 'When to reach for it', body: `<p>If a problem mixes <strong>range queries with mutations</strong> on the same data, segment tree is the answer. Examples: Range Sum with point updates, Range Minimum Query with updates, Counting Smaller Numbers After Self.</p>
<p>If you only need range queries on an <em>immutable</em> array, use prefix sums instead — they\'re simpler and faster.</p>` }
    ],
    examples: [
      { title: 'Range Sum with point updates', problemId: null,
        problem: 'Support sumRange(L, R) and update(i, val) on an array of size n.',
        approach: `<p>Build a segment tree where each node stores the sum of its range. Query sums up the contributions of nodes that lie fully inside [L, R]. Update walks to the leaf, then re-sums the path back up.</p>`,
        code: `class SegTree:
    def __init__(self, nums):
        self.n = len(nums)
        self.tree = [0] * (4 * self.n)
        self._build(0, 0, self.n - 1, nums)

    def _build(self, node, l, r, nums):
        if l == r:
            self.tree[node] = nums[l]; return
        mid = (l + r) // 2
        self._build(2*node+1, l, mid, nums)
        self._build(2*node+2, mid+1, r, nums)
        self.tree[node] = self.tree[2*node+1] + self.tree[2*node+2]

    def update(self, i, val, node=0, l=0, r=None):
        if r is None: r = self.n - 1
        if l == r:
            self.tree[node] = val; return
        mid = (l + r) // 2
        if i <= mid: self.update(i, val, 2*node+1, l, mid)
        else:        self.update(i, val, 2*node+2, mid+1, r)
        self.tree[node] = self.tree[2*node+1] + self.tree[2*node+2]

    def query(self, ql, qr, node=0, l=0, r=None):
        if r is None: r = self.n - 1
        if qr < l or ql > r: return 0
        if ql <= l and r <= qr: return self.tree[node]
        mid = (l + r) // 2
        return (self.query(ql, qr, 2*node+1, l, mid) +
                self.query(ql, qr, 2*node+2, mid+1, r))`,

    if not pattern: return 0
    # build LPS
    lps = [0] * len(pattern)
    k = 0
    for i in range(1, len(pattern)):
        while k > 0 and pattern[k] != pattern[i]:

        if pattern[k] == pattern[i]:

        lps[i] = k
    # search

const SECTION_COLORS = { 'Foundations': '#7c6af7', 'Data Structures': '#4aa6ff', 'Patterns': '#f0a500' };

function svgBigOCurves() {
  const W = 460, H = 280, pad = 36;
  const xMax = 10, yMax = 1024;
  const px = (x) => pad + (x / xMax) * (W - pad * 2);
  const py = (y) => H - pad - (Math.log10(Math.max(1, y) + 1) / Math.log10(yMax + 1)) * (H - pad * 2);
  const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
  const fns = [
    { name: 'O(n!)',     color: '#a855f7', f: n => fact(n) },
    { name: 'O(2ⁿ)',     color: '#ef4444', f: n => Math.pow(2, n) },
    { name: 'O(n²)',     color: '#f97316', f: n => n*n },
    { name: 'O(n log n)',color: '#fbbf24', f: n => n * Math.log2(Math.max(2, n)) },
    { name: 'O(n)',      color: '#10b981', f: n => n },
    { name: 'O(log n)',  color: '#34d399', f: n => Math.log2(Math.max(1, n)) },
    { name: 'O(1)',      color: '#9ca3af', f: () => 1 },
  ];
  let paths = '';
  for (const c of fns) {
    const pts = [];
    for (let n = 1; n <= xMax; n++) pts.push(`${px(n)},${py(c.f(n))}`);
    paths += `<polyline points="${pts.join(' ')}" stroke="${c.color}" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    const labelY = Math.min(Math.max(py(c.f(xMax)), pad + 8), H - pad - 4);
    paths += `<text x="${W - pad + 4}" y="${labelY + 4}" font-size="11" fill="${c.color}" font-weight="600">${c.name}</text>`;
  }
  return `<svg viewBox="0 0 ${W + 70} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#444"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#444"/>
    <text x="${(W-pad)/2 + pad/2}" y="${H-10}" font-size="11" fill="#888" text-anchor="middle">input size n →</text>
    <text x="14" y="${H/2}" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 14 ${H/2})">operations →</text>
    ${paths}
  </svg>`;
}

function svgHashMap() {
  const W = 460, H = 280;
  let html = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  // Buckets array
  const bx = 60, by = 80, bw = 60, bh = 40;
  for (let i = 0; i < 5; i++) {
    html += `<rect x="${bx + i * bw}" y="${by}" width="${bw}" height="${bh}" fill="#1a1a1a" stroke="#4aa6ff" stroke-width="1.5"/>`;
    html += `<text x="${bx + i * bw + bw/2}" y="${by + bh/2 + 4}" font-size="11" fill="#888" text-anchor="middle">${i}</text>`;
  }
  // Key bubbles with arrows pointing into buckets
  const keys = [
    { label: '"alice"', target: 1, x: 90, y: 30 },
    { label: '"bob"', target: 3, x: 240, y: 30 },
    { label: '"carol"', target: 4, x: 350, y: 30 },
  ];
  keys.forEach(k => {
    html += `<rect x="${k.x}" y="${k.y}" width="70" height="22" fill="#222" stroke="var(--medium)" stroke-width="1.5" rx="11"/>`;
    html += `<text x="${k.x + 35}" y="${k.y + 15}" font-size="11" fill="#f0a500" text-anchor="middle" font-family="monospace">${k.label}</text>`;
    const tx = bx + k.target * bw + bw / 2, ty = by;
    html += `<line x1="${k.x + 35}" y1="${k.y + 22}" x2="${tx}" y2="${ty}" stroke="#666" stroke-dasharray="2 3" stroke-width="1"/>`;
    html += `<polygon points="${tx-3},${ty-5} ${tx+3},${ty-5} ${tx},${ty}" fill="#666"/>`;
  });
  // Values stacked below buckets
  const vals = [
    { idx: 1, items: ['(alice, 27)'] },
    { idx: 3, items: ['(bob, 31)'] },
    { idx: 4, items: ['(carol, 24)'] },
  ];
  vals.forEach(v => {
    const cx = bx + v.idx * bw + bw / 2;
    let cy = by + bh + 14;
    v.items.forEach(item => {
      html += `<rect x="${cx - 50}" y="${cy}" width="100" height="22" fill="rgba(74,166,255,.1)" stroke="#4aa6ff" stroke-width="1" rx="4"/>`;

    html += `<line x1="${cx}" y1="${by + bh}" x2="${cx}" y2="${by + bh + 12}" stroke="#4aa6ff" stroke-width="1"/>`;
  });
  html += `<text x="${W/2}" y="${H - 18}" font-size="11" fill="#888" text-anchor="middle">key → hash() → bucket index → value · average O(1)</text>`;
  html += `</svg>`;
  return html;

function svgBitManip() {

      s += `<text x="${startX + i * cellW + cellW/2}" y="${y + 22}" font-size="14" fill="${v ? '#fff' : '#666'}" text-anchor="middle" font-family="monospace" font-weight="700">${v}</text>`;
    });
    return s;
  }
  let h = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  h += row(a, 50, 'A', '#7c6af7');

  h += `<text x="${W/2}" y="158" font-size="13" fill="var(--medium)" text-anchor="middle" font-family="monospace" font-weight="700">A ⊕ B (XOR)</text>`;

  h += `<text x="${W/2}" y="252" font-size="11" fill="#888" text-anchor="middle">bits differ → 1 · same → 0</text>`;
  return h + `</svg>`;
}
