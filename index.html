function svgIntervals() {
  const W = 460, H = 280;
  const intervals = [
    { s: 1, e: 4, color: '#7c6af7' },
    { s: 3, e: 6, color: '#7c6af7' },
    { s: 7, e: 9, color: '#10b981' },
    { s: 8, e: 11, color: '#10b981' },
    { s: 11, e: 14, color: '#f0a500' },
  ];
  const tlStart = 60, tlEnd = 410, tlY = 220;
  const xMax = 14;
  const px = (t) => tlStart + (t / xMax) * (tlEnd - tlStart);
  let h = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  // Bars stacked
  intervals.forEach((iv, i) => {
    const y = 60 + i * 28;
    h += `<rect x="${px(iv.s)}" y="${y}" width="${px(iv.e) - px(iv.s)}" height="22" fill="${iv.color}" opacity="0.8" rx="3"/>`;
    h += `<text x="${px(iv.s) + 4}" y="${y + 15}" font-size="11" fill="#fff" font-family="monospace" font-weight="600">[${iv.s}, ${iv.e}]</text>`;
  });
  // Timeline
  h += `<line x1="${tlStart}" y1="${tlY}" x2="${tlEnd}" y2="${tlY}" stroke="#666" stroke-width="1"/>`;
  for (let t = 0; t <= xMax; t++) {
    const x = px(t);
    h += `<line x1="${x}" y1="${tlY - 3}" x2="${x}" y2="${tlY + 3}" stroke="#666"/>`;
    if (t % 2 === 0) h += `<text x="${x}" y="${tlY + 16}" font-size="9" fill="#666" text-anchor="middle">${t}</text>`;
  }
  h += `<text x="${W/2}" y="252" font-size="11" fill="#888" text-anchor="middle">overlapping intervals (purple) merge → [1,6] · sort by start, then sweep</text>`;
  return h + `</svg>`;

  });
  // Pointers

function svgBfsDfs() {
  const W = 460, H = 280;
  // Two trees side by side, staggered animation per visit order
  function tree(offset, order, color, label) {
    const positions = [
      { x: offset + 80, y: 60 },
      { x: offset + 40, y: 120 },
      { x: offset + 120, y: 120 },
      { x: offset + 16, y: 180 },
      { x: offset + 64, y: 180 },
      { x: offset + 96, y: 180 },
      { x: offset + 144, y: 180 },
    ];
    const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
    let s = `<text x="${offset + 80}" y="36" font-size="13" fill="${color}" text-anchor="middle" font-weight="700">${label}</text>`;
    edges.forEach(([a,b]) => {
      s += `<line x1="${positions[a].x}" y1="${positions[a].y}" x2="${positions[b].x}" y2="${positions[b].y}" stroke="#444" stroke-width="1"/>`;
    });
    positions.forEach((p, i) => {
      // Stagger animation delay so nodes "light up" in visit order
      const delay = `${(order[i] - 1) * 0.85}s`;
      s += `<g class="bfs-step" style="animation-delay:${delay}">`;
      s += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="${color}" stroke="${color}" stroke-width="1.5" opacity="0.25"/>`;
      s += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="#1a1a1a" stroke="${color}" stroke-width="1.5"/>`;
      s += `<text x="${p.x}" y="${p.y + 4}" font-size="12" fill="${color}" text-anchor="middle" font-family="monospace" font-weight="700">${order[i]}</text>`;
      s += `</g>`;
    });
    return s;
  }
  let h = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  // BFS order: level 0,1,2,3,4,5,6 → root,L,R,LL,LR,RL,RR = 1,2,3,4,5,6,7
  h += tree(40, [1,2,3,4,5,6,7], '#7c6af7', 'BFS · level by level');
  // DFS pre-order: root → leftmost path → backtrack
  h += tree(280, [1,2,4,5,3,6,7], '#f0a500', 'DFS · go deep first');
  h += `<text x="${W/2}" y="232" font-size="12" fill="#888" text-anchor="middle">numbers show visit order · same tree, different traversal</text>`;
  h += `<text x="${W/2}" y="252" font-size="11" fill="#888" text-anchor="middle">BFS uses a queue · DFS uses recursion (or a stack)</text>`;
  return h + `</svg>`;
}

function svgLineSweep() {
  const W = 460, H = 280;
  const events = [

  // Timeline
  h += `<line x1="${tlStart}" y1="${tlY}" x2="${tlEnd}" y2="${tlY}" stroke="#666" stroke-width="1"/>`;

    h += `<line x1="${x}" y1="${tlY-3}" x2="${x}" y2="${tlY+3}" stroke="#666"/>`;

  }

    h += `<line x1="${px(e.t)}" y1="${e.y}" x2="${px(e.t)}" y2="${tlY}" stroke="${color}" stroke-width="1.5" stroke-dasharray="3 2"/>`;

  });

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function switchMode(mode) {
  resetTimer();
  currentMode = mode;
  ['learn', 'drills', 'problems', 'bigo', 'sorting', 'mock'].forEach(m =>
    document.getElementById(`tab-${m}`).classList.toggle('active', m === mode));
  document.getElementById('progressBar').style.display = mode === 'problems' ? '' : 'none';
  document.getElementById('pText').style.display = mode === 'problems' ? '' : 'none';
  const main = document.getElementById('appMain');
  main.className = `mode-${mode}`;
  if (mode === 'learn') renderLearnMode();
  else if (mode === 'drills') renderDrillsMode();
  else if (mode === 'problems') renderProblemsMode();
  else if (mode === 'bigo') renderBigoMode();
  else if (mode === 'sorting') renderSortingMode();
  else if (mode === 'mock') renderMockMode();
}

function renderMockSidebar() {
  const sb = document.getElementById('mockSidebar');
  if (!sb) return;
  const total = mockHistory.length;
  const cleanSolves = mockHistory.filter(h => h.outcome === 'solved-clean').length;
  const rate = total ? Math.round(cleanSolves / total * 100) : 0;
  const recent = mockHistory.slice(-8).reverse();
  const rows = recent.map(h => {
    const p = problems.find(x => x.id === h.problemId);
    const date = new Date(h.ts).toLocaleDateString();
    const outcomeCls = h.outcome === 'solved-clean' ? 'high' : h.outcome === 'solved-hint' ? 'mid' : 'low';
    return `<div class="stat-row"><span title="${p ? p.name : '?'}">${(p ? p.name : '?').slice(0, 20)}</span><span class="acc ${outcomeCls}">${date}</span></div>`;

        </div>
      </div>`;

      <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)">

}

function startMock() {
  // Pick a random problem the user hasn't solved yet (or any if all solved)
  const unsolved = problems.filter(p => !done.has(p.id) && !p.premium);
  const pool = unsolved.length ? unsolved : problems.filter(p => !p.premium);
  mockProblem = pool[Math.floor(Math.random() * pool.length)];
  mockStart = Date.now();
  mockSecsRemaining = MOCK_DURATION;
  mockState = 'active';
  renderMockContent();
  if (mockTickInterval) clearInterval(mockTickInterval);
  mockTickInterval = setInterval(() => {
    mockSecsRemaining--;
    if (mockSecsRemaining <= 0) {
      clearInterval(mockTickInterval);
      mockSecsRemaining = 0;
      endMock('stuck');
    } else {
      renderMockContent();
    }
  }, 1000);
}

function endMock(outcome) {
  if (mockTickInterval) clearInterval(mockTickInterval);
  mockTickInterval = null;
  mockState = 'grading';
  mockRubricAnswers = MOCK_RUBRIC.map(() => false);
  mockProblem._endOutcome = outcome;
  renderMockContent();
}

function finishMock() {
  const durationSec = Math.round((Date.now() - mockStart) / 1000);
  const outcome = mockProblem._endOutcome;
  const session = { ts: Date.now(), problemId: mockProblem.id, durationSec, outcome, rubric: mockRubricAnswers };
  mockHistory.push(session);
  api('/api/log-mock', { problemId: mockProblem.id, durationSec, outcome, rubric: mockRubricAnswers });
  mockState = 'idle';
  mockProblem = null;
  renderMockSidebar();
  renderMockContent();
}

const PATTERNS_PER_SESSION = 15;
const VOCAB_PER_SESSION = 20;

// ── Drills state ──────────────────────────────────────────────────────────
let drillsSubMode = 'patterns'; // 'patterns' | 'vocab'
let patternsQueue = [], patternsIdx = 0, patternsSession = {correct:0,total:0}, patternsAnswered = false, patternsPicked = null, patternsAllTime = {};
let vocabQueue = [], vocabIdx = 0, vocabSession = {correct:0,total:0}, vocabAnswered = false, vocabPicked = null, vocabAllTime = {};

function shuffleCopy(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startPatternsSession() {
  patternsQueue = shuffleCopy(PATTERN_QUESTIONS).slice(0, PATTERNS_PER_SESSION);
  patternsIdx = 0;
  patternsSession = { correct: 0, total: 0 };
  patternsAnswered = false;
  patternsPicked = null;
  drillsSubMode = 'patterns';
  renderDrillsSidebar();
  renderDrillsContent();
}

function startVocabSession() {
  // Build questions on the fly: pick a subset of terms, generate 3 random distractor terms
  const allTerms = VOCAB_TERMS.map(t => t.term);
  const sample = shuffleCopy(VOCAB_TERMS).slice(0, VOCAB_PER_SESSION);
  const termDefnMap = Object.fromEntries(VOCAB_TERMS.map(t => [t.term, t.defn]));
  const built = sample.map(item => {
    const distractors = shuffleCopy(allTerms.filter(t => t !== item.term)).slice(0, 3);
    const options = shuffleCopy([item.term, ...distractors]);
    return {
      id: 'v_' + item.term.replace(/[^a-z0-9]+/gi, '_'),
      level: item.level,
      term: item.term,
      defn: item.defn,
      options,
      answerIdx: options.indexOf(item.term),
      optionDefns: options.map(o => termDefnMap[o]),
    };
  });
  vocabQueue = built;
  vocabIdx = 0;
  vocabSession = { correct: 0, total: 0 };
  vocabAnswered = false;
  vocabPicked = null;
  drillsSubMode = 'vocab';
  renderDrillsSidebar();
  renderDrillsContent();
}

function renderDrillsMode() {
  document.getElementById('appMain').innerHTML = `
    <aside class="sidebar" id="drillsSidebar"></aside>
    <section class="panel quiz-wrap" id="drillsPanel"></section>`;
  if (drillsSubMode === 'patterns' && !patternsQueue.length) startPatternsSession();
  else if (drillsSubMode === 'vocab' && !vocabQueue.length) startVocabSession();
  else { renderDrillsSidebar(); renderDrillsContent(); }
}

function setDrillsSubMode(m) {
  drillsSubMode = m;
  if (m === 'patterns' && !patternsQueue.length) startPatternsSession();
  else if (m === 'vocab' && !vocabQueue.length) startVocabSession();
  else { renderDrillsSidebar(); renderDrillsContent(); }
}

function renderDrillsContent() {
  if (drillsSubMode === 'patterns') renderPatternsCard();
  else renderVocabCard();
}

function renderDrillsSidebar() {
  const sb = document.getElementById('drillsSidebar');
  if (!sb) return;
  const isPatterns = drillsSubMode === 'patterns';
  const session = isPatterns ? patternsSession : vocabSession;
  const queue = isPatterns ? patternsQueue : vocabQueue;
  const idx = isPatterns ? patternsIdx : vocabIdx;
  const allTime = isPatterns ? patternsAllTime : vocabAllTime;
  const total = Object.values(allTime).reduce((s,x)=>s+x.total,0);
  const correct = Object.values(allTime).reduce((s,x)=>s+x.correct,0);
  const overallPct = total ? Math.round(correct/total*100) : 0;
  const sessPct = session.total ? Math.round(session.correct/session.total*100) : 0;
  // Breakdown by item
  const items = isPatterns ? PATTERN_QUESTIONS : VOCAB_TERMS;
  const breakdownRows = items.map(item => {
    const id = isPatterns ? item.id : ('v_' + item.term.replace(/[^a-z0-9]+/gi,'_'));
    const s = allTime[id];
    if (!s || !s.total) return '';
    const pct = Math.round(s.correct/s.total*100);
    const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
    const label = isPatterns
      ? (item.options[item.answerIdx])
      : item.term;
    const truncated = label.length > 26 ? label.slice(0,24)+'…' : label;
    return `<div class="stat-row"><span title="${label.replace(/"/g,'&quot;')}">${truncated}</span><span class="acc ${cls}">${pct}%</span></div>`;
  }).join('');
  const startFn = isPatterns ? 'startPatternsSession()' : 'startVocabSession()';
  sb.innerHTML = `
    <div class="submode-toggle">
      <button class="submode-btn ${isPatterns?'active':''}" onclick="setDrillsSubMode('patterns')">🧠 Patterns</button>
      <button class="submode-btn ${!isPatterns?'active':''}" onclick="setDrillsSubMode('vocab')">📖 Vocab</button>
    </div>
    <div class="stats-section">
      <h3>This Session</h3>
      <div class="stats-grid">
        <div class="stat-cell"><div class="num">${session.correct}/${session.total}</div><div class="lbl">Score</div></div>
        <div class="stat-cell"><div class="num">${sessPct}%</div><div class="lbl">Accuracy</div></div>
        <div class="stat-cell"><div class="num">${idx}/${queue.length || items.length}</div><div class="lbl">Progress</div></div>
        <div class="stat-cell"><div class="num">${overallPct}%</div><div class="lbl">All-Time</div></div>
      </div>
    </div>
    <div class="stats-section">
      <button class="btn btn-ghost" style="width:100%;justify-content:center;font-size:12px" onclick="${startFn}">↻ New Session</button>
    </div>
    <div class="stats-list">${breakdownRows || '<div style="padding:14px;font-size:11px;color:var(--muted);text-align:center">Answer questions to build history.</div>'}</div>`;
}

function renderPatternsCard() {
  const panel = document.getElementById('drillsPanel');
  if (!panel) return;
  if (patternsIdx >= patternsQueue.length) { renderPatternsSummary(); return; }
  const q = patternsQueue[patternsIdx];
  const stats = patternsAllTime[q.id];
  const allTimeStr = stats && stats.total ? ` · seen ${stats.total}× · ${Math.round(stats.correct/stats.total*100)}% correct` : '';
  const progressPct = (patternsIdx / patternsQueue.length) * 100;
  const buttons = q.options.map((opt, i) => {
    let cls = 'btn-pattern';
    if (patternsAnswered) {
      if (i === q.answerIdx) cls += ' correct';
      else if (i === patternsPicked) cls += ' wrong';
    }
    return `<button class="${cls}" ${patternsAnswered?'disabled':''} onclick="pickPatternsAnswer(${i})">${opt}</button>`;
  }).join('');
  let feedback = '';
  if (patternsAnswered) {
    const right = patternsPicked === q.answerIdx;
    const wrongReason = (!right && q.wrongReasons && q.wrongReasons[patternsPicked])
      ? `<div class="wrong-reason">Why <b>${q.options[patternsPicked]}</b> doesn't fit: ${q.wrongReasons[patternsPicked]}</div>`
      : '';
    feedback = `<div class="quiz-feedback ${right?'right':'wrong'}">
      ${right ? '✓ Correct! You spotted the pattern.' : `✗ The best fit is: <b>${q.options[q.answerIdx]}</b>`}
      <div class="exp">${q.explanation}</div>
    </div>
    ${wrongReason}
    <div class="quiz-actions">
      <button class="btn btn-primary" onclick="nextPatternsQuestion()">${patternsIdx === patternsQueue.length - 1 ? 'See Results' : 'Next →'}</button>
    </div>`;
  }
  const levelPill = q.level ? `<span class="level-pill ${q.level}">${q.level}</span>` : '';
  panel.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-bar">
        <span>Pattern ${patternsIdx + 1} of ${patternsQueue.length}${allTimeStr}</span>
        ${levelPill}
      </div>
      <div class="quiz-progressbar"><div style="width:${progressPct}%"></div></div>
      <div class="vocab-prompt">Pick the BEST pattern for this scenario</div>
      <div class="example-problem" style="margin-bottom:18px">${q.scenario}</div>
      <div class="pattern-grid">${buttons}</div>
      ${feedback}
    </div>`;
}

function pickPatternsAnswer(idx) {
  if (patternsAnswered) return;
  patternsAnswered = true;
  patternsPicked = idx;
  const q = patternsQueue[patternsIdx];
  const correct = idx === q.answerIdx;
  patternsSession.total++;
  if (correct) patternsSession.correct++;
  else {
    const reIdx = Math.min(patternsIdx + 3, patternsQueue.length);
    patternsQueue.splice(reIdx, 0, q);
  }
  patternsAllTime[q.id] = patternsAllTime[q.id] || { correct: 0, total: 0 };
  patternsAllTime[q.id].total++;
  if (correct) patternsAllTime[q.id].correct++;
  api('/api/log-quiz', { quizType: 'pattern', questionId: q.id, correct });
  renderPatternsCard();
  renderDrillsSidebar();
}

function nextPatternsQuestion() {
  patternsIdx++;
  patternsAnswered = false;
  patternsPicked = null;
  renderPatternsCard();
  renderDrillsSidebar();
}

function renderPatternsSummary() {
  const panel = document.getElementById('drillsPanel');
  if (!panel) return;
  const pct = patternsSession.total ? Math.round(patternsSession.correct/patternsSession.total*100) : 0;
  panel.innerHTML = `
    <div class="quiz-card quiz-summary">
      <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">Pattern Session Complete</div>
      <div class="big-num">${patternsSession.correct}/${patternsSession.total}</div>
      <div class="sub">${pct}% accuracy</div>
      <button class="btn btn-primary" onclick="startPatternsSession()">↻ New Session</button>
    </div>`;
}

function renderVocabCard() {
  const panel = document.getElementById('drillsPanel');
  if (!panel) return;
  if (vocabIdx >= vocabQueue.length) { renderVocabSummary(); return; }
  const q = vocabQueue[vocabIdx];
  const stats = vocabAllTime[q.id];
  const allTimeStr = stats && stats.total ? ` · seen ${stats.total}× · ${Math.round(stats.correct/stats.total*100)}% correct` : '';
  const progressPct = (vocabIdx / vocabQueue.length) * 100;
  const buttons = q.options.map((opt, i) => {
    let cls = 'btn-mc';
    if (vocabAnswered) {
      if (i === q.answerIdx) cls += ' correct';
      else if (i === vocabPicked) cls += ' wrong';
    }
    return `<button class="${cls}" ${vocabAnswered?'disabled':''} onclick="pickVocabAnswer(${i})">${opt}</button>`;
  }).join('');
  let feedback = '';
  if (vocabAnswered) {
    const right = vocabPicked === q.answerIdx;
    const pickedTerm = q.options[vocabPicked];
    const pickedDefn = q.optionDefns ? q.optionDefns[vocabPicked] : '';
    const contrast = (!right && pickedDefn)
      ? `<div class="vocab-contrast"><b>${pickedTerm}</b> actually means: ${pickedDefn}</div>`
      : '';
    feedback = `<div class="quiz-feedback ${right?'right':'wrong'}">
      ${right ? `✓ Correct! That\'s <b>${q.term}</b>.` : `✗ The term is: <b>${q.term}</b>`}
    </div>
    ${contrast}
    <div class="quiz-actions">
      <button class="btn btn-primary" onclick="nextVocabQuestion()">${vocabIdx === vocabQueue.length - 1 ? 'See Results' : 'Next →'}</button>
    </div>`;
  }
  const levelPill = q.level ? `<span class="level-pill ${q.level}">${q.level}</span>` : '';
  panel.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-bar">
        <span>Term ${vocabIdx + 1} of ${vocabQueue.length}${allTimeStr}</span>
        ${levelPill}
      </div>
      <div class="quiz-progressbar"><div style="width:${progressPct}%"></div></div>
      <div class="vocab-prompt">Match this definition to the correct term</div>
      <div class="vocab-defn">${q.defn}</div>
      <div class="mc-options">${buttons}</div>
      ${feedback}
    </div>`;
}

function renderVocabSummary() {

// ── Learn mode rendering ───────────────────────────────────────────────────
function renderLearnMode() {
  if (learnView === 'detail' && learnTopicId) renderTopicDetail(learnTopicId);
  else renderTopicMap();
}

function renderTopicMap() {
  learnView = 'map';
  const sections = ['Foundations', 'Data Structures', 'Patterns'];
  const grouped = {};
  sections.forEach(s => grouped[s] = []);
  LEARNING_TOPICS.forEach(t => grouped[t.section].push(t));
  const sectionsHtml = sections.map(s => {
    const items = grouped[s].slice();
    // Capstone topics always render last within their section
    items.sort((a, b) => {
      const rank = (t) => t.capstone ? 3 : t.advanced ? 2 : t.optional ? 1 : 0;
      return rank(a) - rank(b);
    });
    if (!items.length) return '';
    const cls = s.toLowerCase().replace(' ', '-');
    return `
      <div class="section-label ${cls}">${s}</div>
      <div class="topic-grid">
        ${items.map(t => topicCardHtml(t)).join('')}
      </div>`;
  }).join('');
  document.getElementById('appMain').innerHTML = `
    <div class="learn-container">
      <div class="learn-header">
        <h2>Learn the concepts first</h2>
        <p>Visual intros, short videos, and key takeaways. When you're ready, jump into practice.</p>
      </div>
      ${sectionsHtml}
    </div>`;
}

function topicCardHtml(t) {
  const state = learningState[t.id] || {};
  const cls = t.section.toLowerCase().replace(' ', '-');
  const iconSvg = (SVGS[t.cardIcon] || SVGS[t.diagram] || (() => ''))();
  let badge = '';
  if (state.complete) badge = '<span class="badge-status complete" title="Understood">✓</span>';
  else if (state.videoWatched) badge = '<span class="badge-status watched" title="Watched">👁</span>';
  else badge = '<span class="badge-status" style="color:var(--muted)" title="Not started">○</span>';
  let tag = '';
  if (t.capstone) tag = '<span class="tag-capstone" title="Capstone topic">CAPSTONE</span>';
  else if (t.advanced) tag = '<span class="tag-advanced" title="Hard-tier advanced topic">ADVANCED</span>';
  else if (t.optional) tag = '<span class="tag-optional" title="Optional topic">OPTIONAL</span>';
  const optionalCls = t.optional ? ' optional' : '';
  return `
    <div class="topic-card ${cls}${optionalCls}" onclick="goToTopic('${t.id}')">
      <div class="card-icon">${iconSvg}</div>
      <div class="card-body">
        <div class="card-title">${t.title} ${tag}${badge}</div>
        <div class="card-summary">${t.summary}</div>
        <div class="card-meta">
          <span class="card-time">⏱ ${t.estMin} min</span>
          <span>${t.section}</span>
        </div>
      </div>
    </div>`;
}

function corePrereqProgress() {
  const core = LEARNING_TOPICS.filter(t => !t.capstone && !t.optional && !t.advanced);
  const complete = core.filter(t => (learningState[t.id] || {}).complete).length;
  return { complete, total: core.length, pct: Math.round(complete / core.length * 100) };
}

function capstoneGateHtml() {
  const p = corePrereqProgress();
  const ready = p.complete >= p.total;
  return `<div class="capstone-gate">
    <div class="gate-title">${ready ? '✓ You\'re ready' : '🔒 Capstone — finish the other topics first'}</div>
    <p>${ready
      ? 'You\'ve marked all core topics as understood. DP is the natural next step — it builds on recursion, memoization, and pattern recognition you\'ve already practiced.'
      : 'Dynamic Programming pulls together recursion, memoization, and pattern recognition from earlier topics. Mark the core topics as ✓ Understood before tackling DP — you\'ll struggle without that foundation.'}</p>
    <div class="gate-bar"><div style="width:${p.pct}%"></div></div>
    <p style="margin-top: 4px; font-size: 11px; color: var(--muted);">${p.complete} of ${p.total} core topics complete · ${p.pct}%${ready ? '' : ' — Bit Manipulation is optional and doesn\'t count.'}</p>
  </div>`;
}

function goToTopic(id) {
  learnTopicId = id;
  learnView = 'detail';
  // Clear comprehension state for this topic so each visit picks fresh questions from the pool
  Object.keys(comprehensionSelected).forEach(k => { if (k.startsWith(id + '-')) delete comprehensionSelected[k]; });
  Object.keys(comprehensionAnswers).forEach(k => { if (k.startsWith(id + '-')) delete comprehensionAnswers[k]; });
  renderTopicDetail(id);
  api('/api/learning', { topicId: id, field: 'lastVisited', value: Date.now() });
}

function backToMap() {
  learnView = 'map';
  learnTopicId = null;
  renderTopicMap();
}

function topicProgress(t) {
  const p = t.practice || {};
  if (p.type === 'bigo') {
    // For Big-O topic: aggregate across all complexity classes
    const total = Object.values(bigoAllTime).reduce((s, x) => s + x.total, 0);
    const correct = Object.values(bigoAllTime).reduce((s, x) => s + x.correct, 0);
    if (!total) return null;
    return { label: 'Big-O quiz accuracy', correct, total, pct: Math.round(correct/total*100) };
  }
  if (p.type === 'sorting') {
    const total = Object.values(sortingAllTime).reduce((s, x) => s + x.total, 0);
    const correct = Object.values(sortingAllTime).reduce((s, x) => s + x.correct, 0);
    if (!total) return null;
    return { label: 'Sorting quiz accuracy', correct, total, pct: Math.round(correct/total*100) };
  }
  if (p.type === 'problems') {
    let matching = problems;
    if (p.filter && p.filter.category) matching = matching.filter(x => x.category === p.filter.category);
    if (p.filter && p.filter.ds) matching = matching.filter(x => x.ds === p.filter.ds);
    if (!matching.length) return null;
    const doneCount = matching.filter(x => done.has(x.id)).length;
    return { label: 'Problems solved', correct: doneCount, total: matching.length, pct: Math.round(doneCount/matching.length*100) };
  }
  return null;
}

function progressBarHtml(prog) {
  if (!prog) return '';
  const cls = prog.pct >= 80 ? 'high' : prog.pct >= 50 ? 'mid' : 'low';
  return `<div style="margin: 14px 0 22px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;">
    <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700;">Your progress · ${prog.label}</div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;">
        <div class="bar-fill ${cls}" style="height:100%; width:${prog.pct}%; border-radius: 3px;"></div>
      </div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; color: ${prog.pct >= 80 ? 'var(--easy)' : prog.pct >= 50 ? 'var(--medium)' : 'var(--hard)'};">${prog.correct}/${prog.total} · ${prog.pct}%</div>
    </div>
  </div>`;
}

function examplesHtml(examples, topicId) {
  const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cards = examples.map((ex, i) => {

    const cta = linkedProblem
      ? `<button class="btn btn-ghost example-cta" onclick="goToProblemFromTopic(${ex.problemId})">→ Try it on Blind 75 ▸ ${linkedProblem.name}</button>`
      : '';
    return `<div class="example-card">
      <div class="example-title">
        <span class="example-num">EXAMPLE ${i + 1}</span>
        <span>${ex.title}</span>
      </div>
      <div class="example-problem">${ex.problem}</div>
      ${ex.approach ? `<div class="example-approach">${ex.approach}</div>` : ''}
      ${ex.code ? `<pre>${escape(ex.code)}</pre>` : ''}
      <div class="example-meta">
        ${ex.time ? `<span class="badge time">Time: ${ex.time}</span>` : ''}
        ${ex.space ? `<span class="badge space">Space: ${ex.space}</span>` : ''}
      </div>
      ${ex.why ? `<div class="example-why">${ex.why}</div>` : ''}
      ${cta}

// In-memory comprehension state (per topic + example index + level)
const comprehensionAnswers = {};

// In-memory line-walk + typing state (per topic + example index)
const lineWalkOpen = {};   // key 'topicId-exIdx' → bool
const typingOpen = {};     // key 'topicId-exIdx' → bool
const typingInputs = {};   // key 'topicId-exIdx' → string (user's typed code)
const typingRefShown = {}; // key 'topicId-exIdx' → bool

function lineAnnotationsHtml(topicId, exIdx, code) {
  const annotations = (EXAMPLE_ANNOTATIONS[`${topicId}-${exIdx}`] || []);
  const lines = code.split('\n');
  const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rows = lines.map((line, i) => {
    const ann = annotations[i];
    return `<div class="line-row">
      <div class="line-num">${i + 1}</div>
      <div class="line-content">
        <div class="line-code">${escape(line) || '&nbsp;'}</div>
        <div class="line-explain ${ann?'':'empty'}">${ann || '(no annotation for this line yet)'}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="line-annotations">
    <h5>💡 Line-by-line walkthrough</h5>
    ${rows}
  </div>`;
}

function typingSectionHtml(topicId, exIdx, code) {
  const key = `${topicId}-${exIdx}`;
  const typed = typingInputs[key] || '';
  const refShown = typingRefShown[key];
  // Compute simple diff stats
  let diffSummary = '';
  if (typed.trim()) {
    const norm = (s) => s.split('\n').map(l => l.trim()).filter(l => l).join('\n');
    const a = norm(typed), b = norm(code);
    if (a === b) {
      diffSummary = `<div class="typing-diff-summary match">✓ Your code matches the reference (whitespace-normalized).</div>`;
    } else {
      const aLines = a.split('\n'), bLines = b.split('\n');
      const matched = aLines.filter(l => bLines.includes(l)).length;
      const pct = Math.round(matched / Math.max(bLines.length, 1) * 100);
      diffSummary = `<div class="typing-diff-summary partial">≈ ${matched}/${bLines.length} lines match the reference (${pct}%) — minor differences are fine if your logic is right.</div>`;
    }
  }
  const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="typing-section" id="ts-${topicId}-${exIdx}">
    <h5>⌨️ Type it yourself</h5>
    <div class="typing-prompt">Implement this from scratch in the box below. Don't peek at the reference until you've tried.</div>
    <textarea class="typing-textarea" placeholder="def my_solution(...):\n    ..." oninput="updateTyping('${topicId}', ${exIdx}, this.value)">${escape(typed)}</textarea>
    ${diffSummary}
    <div class="typing-actions">
      <button class="btn btn-ghost" onclick="toggleTypingReference('${topicId}', ${exIdx})">${refShown ? '🙈 Hide reference' : '👁 Show reference'}</button>
      <button class="btn btn-ghost" onclick="clearTyping('${topicId}', ${exIdx})">↺ Clear</button>
    </div>
    ${refShown ? `<div class="typing-reference-block">
      <div class="ref-label">Reference solution</div>
      <pre>${escape(code)}</pre>
    </div>` : ''}
  </div>`;
}

function toggleLineWalk(topicId, exIdx) {
  const key = `${topicId}-${exIdx}`;
  lineWalkOpen[key] = !lineWalkOpen[key];
  rerenderExampleExtras(topicId, exIdx);
}

function toggleTypingPractice(topicId, exIdx) {
  const key = `${topicId}-${exIdx}`;
  typingOpen[key] = !typingOpen[key];
  rerenderExampleExtras(topicId, exIdx);
}

function toggleTypingReference(topicId, exIdx) {
  const key = `${topicId}-${exIdx}`;
  typingRefShown[key] = !typingRefShown[key];
  rerenderExampleExtras(topicId, exIdx);
}

function updateTyping(topicId, exIdx, value) {
  typingInputs[`${topicId}-${exIdx}`] = value;
  // Re-render only the diff summary, preserving textarea focus
  const wrap = document.getElementById(`ts-${topicId}-${exIdx}`);
  if (!wrap) return;
  const summary = wrap.querySelector('.typing-diff-summary');
  const ex = (LEARNING_TOPICS.find(t => t.id === topicId) || {}).examples?.[exIdx];
  if (!ex) return;
  const norm = (s) => s.split('\n').map(l => l.trim()).filter(l => l).join('\n');
  const a = norm(value), b = norm(ex.code || '');
  let html = '';
  if (a.trim()) {
    if (a === b) {
      html = `<div class="typing-diff-summary match">✓ Your code matches the reference (whitespace-normalized).</div>`;
    } else {
      const aLines = a.split('\n'), bLines = b.split('\n');
      const matched = aLines.filter(l => bLines.includes(l)).length;
      const pct = Math.round(matched / Math.max(bLines.length, 1) * 100);
      html = `<div class="typing-diff-summary partial">≈ ${matched}/${bLines.length} lines match the reference (${pct}%) — minor differences are fine if your logic is right.</div>`;
    }
  }
  if (summary) summary.outerHTML = html;
  else if (html) wrap.querySelector('.typing-textarea').insertAdjacentHTML('afterend', html);
}

function clearTyping(topicId, exIdx) {
  typingInputs[`${topicId}-${exIdx}`] = '';
  rerenderExampleExtras(topicId, exIdx);
}

function rerenderExampleExtras(topicId, exIdx) {
  // Find the example card and re-render its action area + extras
  const ex = (LEARNING_TOPICS.find(t => t.id === topicId) || {}).examples?.[exIdx];
  if (!ex) return;
  const container = document.getElementById(`ex-extras-${topicId}-${exIdx}`);
  if (container) container.outerHTML = exampleExtrasHtml(topicId, exIdx, ex);
}

function exampleExtrasHtml(topicId, exIdx, ex) {
  const key = `${topicId}-${exIdx}`;
  const hasAnnotations = !!EXAMPLE_ANNOTATIONS[key];
  const hasCode = !!ex.code;
  const lwOpen = lineWalkOpen[key];
  const tyOpen = typingOpen[key];
  const buttons = [];
  if (hasCode && hasAnnotations) {
    buttons.push(`<button class="btn-line-walk ${lwOpen?'on':''}" onclick="toggleLineWalk('${topicId}', ${exIdx})">${lwOpen ? '✓ Line walk' : '💡 Explain each line'}</button>`);
  }
  if (hasCode) {
    buttons.push(`<button class="btn-type-it ${tyOpen?'on':''}" onclick="toggleTypingPractice('${topicId}', ${exIdx})">${tyOpen ? '✓ Typing' : '⌨️ Type it yourself'}</button>`);
  }
  return `<div id="ex-extras-${topicId}-${exIdx}">
    ${buttons.length ? `<div class="example-actions">${buttons.join('')}</div>` : ''}
    ${lwOpen && hasAnnotations ? lineAnnotationsHtml(topicId, exIdx, ex.code) : ''}
    ${tyOpen && hasCode ? typingSectionHtml(topicId, exIdx, ex.code) : ''}
  </div>`;
}

const comprehensionSelected = {}; // 'topicId-exIdx-level' → index into question pool

function pickComprehensionQ(topicId, exIdx, level) {
  const entry = (COMPREHENSION[topicId] || [])[exIdx];
  if (!entry || !entry[level]) return null;
  const pool = Array.isArray(entry[level]) ? entry[level] : [entry[level]];
  const key = `${topicId}-${exIdx}-${level}`;
  if (comprehensionSelected[key] === undefined || comprehensionSelected[key] >= pool.length) {
    comprehensionSelected[key] = Math.floor(Math.random() * pool.length);
  }
  return pool[comprehensionSelected[key]];
}

function rotateComprehensionQ(topicId, exIdx, level) {
  const entry = (COMPREHENSION[topicId] || [])[exIdx];
  if (!entry || !entry[level]) return;
  const pool = Array.isArray(entry[level]) ? entry[level] : [entry[level]];
  if (pool.length < 2) return;
  const key = `${topicId}-${exIdx}-${level}`;
  const cur = comprehensionSelected[key] ?? 0;
  let next = cur;
  while (next === cur) next = Math.floor(Math.random() * pool.length);
  comprehensionSelected[key] = next;
  delete comprehensionAnswers[key];
  const card = document.getElementById(`ck-${topicId}-${exIdx}-${level}`);
  if (card) card.outerHTML = singleComprehensionHtml(topicId, exIdx, level);
}

function singleComprehensionHtml(topicId, exIdx, level) {
  const c = pickComprehensionQ(topicId, exIdx, level);
  if (!c) return '';
  const entry = (COMPREHENSION[topicId] || [])[exIdx];
  const pool = entry && Array.isArray(entry[level]) ? entry[level] : [entry && entry[level]].filter(Boolean);
  const hasMultiple = pool.length > 1;
  const key = `${topicId}-${exIdx}-${level}`;
  const state = comprehensionAnswers[key];
  const buttons = c.options.map((opt, i) => {
    let cls = 'btn-ck';
    if (state) {
      if (i === c.answerIdx) cls += ' correct';
      else if (i === state.picked) cls += ' wrong';
    }
    return `<button class="${cls}" ${state?'disabled':''} onclick="pickComprehension('${topicId}', ${exIdx}, '${level}', ${i})">${opt}</button>`;
  }).join('');
  let feedback = '';
  if (state) {
    feedback = `<div class="ck-feedback ${state.correct?'right':'wrong'}">
      ${state.correct ? '✓ Got it.' : `✗ The answer is: <b>${c.options[c.answerIdx]}</b>`}<br>${c.explanation}
    </div>`;
  }
  const rotateBtn = hasMultiple ? `<button class="btn-rotate-q" onclick="rotateComprehensionQ('${topicId}', ${exIdx}, '${level}')">↻ Try a different question</button>` : '';
  const labelText = level === 'easy' ? 'Quick Check · Easy' : 'Push Yourself · Hard';
  const poolBadge = hasMultiple ? ` <span style="font-size:9px;color:var(--muted);font-weight:400">· 1 of ${pool.length}</span>` : '';
  return `<div class="comprehension-card ${level==='hard'?'hard':''}" id="ck-${topicId}-${exIdx}-${level}">
    <div class="ck-label"><span class="level-pill ${level==='easy'?'easy':'hard'}">${level}</span> ${labelText}${poolBadge}</div>
    <div class="ck-q">${c.q}</div>
    <div class="ck-options">${buttons}</div>
    ${feedback}
    ${rotateBtn}
  </div>`;
}

function comprehensionHtml(topicId, exIdx) {
  const entry = (COMPREHENSION[topicId] || [])[exIdx];
  if (!entry) return '';
  return singleComprehensionHtml(topicId, exIdx, 'easy') + singleComprehensionHtml(topicId, exIdx, 'hard');
}

function pickComprehension(topicId, exIdx, level, optIdx) {
  const c = pickComprehensionQ(topicId, exIdx, level);
  if (!c) return;
  const key = `${topicId}-${exIdx}-${level}`;
  if (comprehensionAnswers[key]) return;
  comprehensionAnswers[key] = { picked: optIdx, correct: optIdx === c.answerIdx };
  const card = document.getElementById(`ck-${topicId}-${exIdx}-${level}`);
  if (card) card.outerHTML = singleComprehensionHtml(topicId, exIdx, level);
}

function goToPractice(practice) {
  if (!practice) return;
  if (practice.type === 'bigo') {
    switchMode('bigo');
    startBigoSession();
  } else if (practice.type === 'sorting') {
    if (practice.algoId) selectedAlgoId = practice.algoId;
    switchMode('sorting');
  } else if (practice.type === 'problems') {
    switchMode('problems');
    if (practice.filter) {
      // After mode switch the DOM has fresh filter selects; populate them
      setTimeout(() => {
        if (practice.filter.ds) {
          // Find a category that contains this DS by cross-referencing PROBLEMS
          const matching = problems.filter(p => p.ds === practice.filter.ds);
          if (matching.length) {
            // Use search to filter by ds — we set search to ds keyword
            const search = document.getElementById('search');
            if (search) { search.value = practice.filter.ds; renderList(); }
          }
        }
        if (practice.filter.category) {
          const cat = document.getElementById('fCat');
          if (cat) { cat.value = practice.filter.category; renderList(); }
        }
      }, 0);
    }
  }
}

// ── Big-O quiz ─────────────────────────────────────────────────────────────
function startBigoSession() {
  bigoQueue = shuffle([...BIG_O_QUESTIONS]);
  bigoIdx = 0;
  bigoSession = { correct: 0, total: 0 };
  bigoStreak = 0;
  bigoAnswered = false;
  bigoPicked = null;
  renderBigoCard();
  renderBigoStats();
}

function renderBigoMode() {
  document.getElementById('appMain').innerHTML = `
    <aside class="sidebar" id="bigoSidebar"></aside>
    <section class="panel quiz-wrap" id="bigoPanel"></section>`;
  if (!bigoQueue.length) startBigoSession();
  else { renderBigoCard(); renderBigoStats(); }
}

function renderBigoStats() {
  const sb = document.getElementById('bigoSidebar');
  if (!sb) return;
  const totalAttempts = Object.values(bigoAllTime).reduce((s, x) => s + x.total, 0);
  const totalCorrect = Object.values(bigoAllTime).reduce((s, x) => s + x.correct, 0);
  const overallPct = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;
  const sessPct = bigoSession.total ? Math.round(bigoSession.correct / bigoSession.total * 100) : 0;
  // Aggregate by complexity class
  const byClass = {};
  COMPLEXITIES.forEach(c => byClass[c] = { correct: 0, total: 0 });
  BIG_O_QUESTIONS.forEach(q => {
    const s = bigoAllTime[q.id];
    if (!s) return;
    byClass[q.answer].correct += s.correct;
    byClass[q.answer].total += s.total;
  });
  const breakdownRows = COMPLEXITIES.map(c => {
    const { correct, total } = byClass[c];
    if (!total) return `<div class="breakdown-row"><span class="complexity">${c}</span><div class="bar-bg"></div><span class="acc-text">—</span></div>`;
    const pct = Math.round(correct / total * 100);
    const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
    return `<div class="breakdown-row">
      <span class="complexity">${c}</span>
      <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="acc-text">${pct}% (${correct}/${total})</span>
    </div>`;
  }).join('');
  sb.innerHTML = `
    <div class="stats-section">
      <h3>This Session</h3>
      <div class="stats-grid">
        <div class="stat-cell"><div class="num">${bigoSession.correct}/${bigoSession.total}</div><div class="lbl">Score</div></div>
        <div class="stat-cell"><div class="num">${sessPct}%</div><div class="lbl">Accuracy</div></div>
        <div class="stat-cell"><div class="num">🔥 ${bigoStreak}</div><div class="lbl">Streak</div></div>
        <div class="stat-cell"><div class="num">${bigoIdx}/${bigoQueue.length || BIG_O_QUESTIONS.length}</div><div class="lbl">Progress</div></div>
      </div>
    </div>
    <div class="stats-section">
      <h3>Weakness · ${totalCorrect}/${totalAttempts} (${overallPct}%)</h3>
      <button class="btn btn-ghost" style="width:100%;justify-content:center;font-size:12px" onclick="startBigoSession()">↻ New Session</button>
    </div>
    <div class="stats-list">${breakdownRows}</div>`;
}

function renderBigoCard() {
  const panel = document.getElementById('bigoPanel');
  if (!panel) return;
  if (bigoIdx >= bigoQueue.length) { renderBigoSummary(); return; }
  const q = bigoQueue[bigoIdx];
  const stats = bigoAllTime[q.id];
  const allTimeStr = stats && stats.total ? ` · seen ${stats.total}× · ${Math.round(stats.correct / stats.total * 100)}% correct` : '';
  const progressPct = (bigoIdx / bigoQueue.length) * 100;
  const buttons = COMPLEXITIES.map(c => {
    let cls = 'btn-complexity';
    if (bigoAnswered) {
      if (c === q.answer) cls += ' correct';
      else if (c === bigoPicked) cls += ' wrong';
    }
    return `<button class="${cls}" ${bigoAnswered ? 'disabled' : ''} onclick="pickBigoAnswer('${c}')">${c}</button>`;
  }).join('');
  let feedback = '';
  if (bigoAnswered) {
    const right = bigoPicked === q.answer;
    feedback = `<div class="quiz-feedback ${right ? 'right' : 'wrong'}">
      ${right ? '✓ Correct!' : `✗ The answer is <b>${q.answer}</b>`}
      <div class="exp">${q.hint}</div>
    </div>
    <div class="quiz-actions">
      <button class="btn btn-primary" onclick="nextBigoQuestion()">${bigoIdx === bigoQueue.length - 1 ? 'See Results' : 'Next →'}</button>
    </div>`;
  }
  panel.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-bar">
        <span>Question ${bigoIdx + 1} of ${bigoQueue.length}${allTimeStr}</span>
        <span class="streak">${bigoStreak > 1 ? '🔥 ' + bigoStreak + ' streak' : ''}</span>
      </div>
      <div class="quiz-progressbar"><div style="width:${progressPct}%"></div></div>
      <div class="quiz-scenario">${q.scenario}</div>
      ${q.code ? `<pre class="quiz-code">${q.code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>` : ''}
      <div class="complexity-grid">${buttons}</div>
      ${feedback}
    </div>`;
}

function pickBigoAnswer(c) {
  if (bigoAnswered) return;
  bigoAnswered = true;
  bigoPicked = c;
  const q = bigoQueue[bigoIdx];
  const correct = c === q.answer;
  bigoSession.total++;
  if (correct) { bigoSession.correct++; bigoStreak++; } else {
    bigoStreak = 0;
    // spaced repetition: re-queue wrong answer 3 slots ahead
    const reIdx = Math.min(bigoIdx + 3, bigoQueue.length);
    bigoQueue.splice(reIdx, 0, q);
  }
  bigoAllTime[q.id] = bigoAllTime[q.id] || { correct: 0, total: 0 };
  bigoAllTime[q.id].total++;
  if (correct) bigoAllTime[q.id].correct++;
  api('/api/log-quiz', { quizType: 'bigo', questionId: q.id, correct });
  renderBigoCard();
  renderBigoStats();
}

function nextBigoQuestion() {
  bigoIdx++;
  bigoAnswered = false;
  bigoPicked = null;
  renderBigoCard();
  renderBigoStats();
}

function renderBigoSummary() {
  const panel = document.getElementById('bigoPanel');
  if (!panel) return;
  const pct = bigoSession.total ? Math.round(bigoSession.correct / bigoSession.total * 100) : 0;
  panel.innerHTML = `
    <div class="quiz-card quiz-summary">
      <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">Session Complete</div>
      <div class="big-num">${bigoSession.correct}/${bigoSession.total}</div>
      <div class="sub">${pct}% accuracy${bigoStreak > 0 ? ` · final streak ${bigoStreak}` : ''}</div>
      <button class="btn btn-primary" onclick="startBigoSession()">↻ New Session</button>
    </div>`;
}

function renderSortingSidebar() {
  const sb = document.getElementById('sortingSidebar');
  if (!sb) return;
  if (sortingSubMode === 'reference') {
    const groups = { 'O(n log n)': [], 'O(n²)': [] };
    SORTING_ALGOS.forEach(a => groups[a.group].push(a));
    const renderGroup = (g, items) => `
      <div class="algo-group-label">${g}</div>
      ${items.map(a => `
        <div class="algo-item ${a.id === selectedAlgoId ? 'active' : ''}" onclick="selectAlgo('${a.id}')">
          <span class="a-name">${a.name}</span>
          ${a.mustKnow ? '<span class="a-tag">KEY</span>' : '<span class="a-tag dim">opt</span>'}
        </div>`).join('')}`;
    sb.innerHTML = `
      <div class="submode-toggle">
        <button class="submode-btn active" onclick="setSortingSubMode('reference')">📖 Reference</button>
        <button class="submode-btn" onclick="setSortingSubMode('quiz')">❓ Quiz</button>
      </div>
      ${renderGroup('O(n log n)', groups['O(n log n)'])}
      ${renderGroup('O(n²)', groups['O(n²)'])}`;
  } else {
    const totalAttempts = Object.values(sortingAllTime).reduce((s, x) => s + x.total, 0);
    const totalCorrect = Object.values(sortingAllTime).reduce((s, x) => s + x.correct, 0);
    const overallPct = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;
    const sessPct = sortingSession.total ? Math.round(sortingSession.correct / sortingSession.total * 100) : 0;
    const rows = SORTING_QUESTIONS.map(q => {
      const s = sortingAllTime[q.id];
      if (!s || !s.total) return '';
      const pct = Math.round(s.correct / s.total * 100);
      const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
      const label = q.question.length > 30 ? q.question.slice(0, 28) + '…' : q.question;
      return `<div class="stat-row"><span title="${q.question.replace(/"/g,'&quot;')}">${label}</span><span class="acc ${cls}">${pct}%</span></div>`;
    }).join('');
    sb.innerHTML = `
      <div class="submode-toggle">
        <button class="submode-btn" onclick="setSortingSubMode('reference')">📖 Reference</button>
        <button class="submode-btn active" onclick="setSortingSubMode('quiz')">❓ Quiz</button>
      </div>
      <div class="stats-section">
        <h3>This Session</h3>
        <div class="stats-grid">
          <div class="stat-cell"><div class="num">${sortingSession.correct}/${sortingSession.total}</div><div class="lbl">Score</div></div>
          <div class="stat-cell"><div class="num">${sessPct}%</div><div class="lbl">Accuracy</div></div>
          <div class="stat-cell"><div class="num">${sortingIdx}/${sortingQueue.length || SORTING_QUESTIONS.length}</div><div class="lbl">Progress</div></div>
          <div class="stat-cell"><div class="num">${overallPct}%</div><div class="lbl">All-Time</div></div>
        </div>
      </div>
      <div class="stats-section">
        <button class="btn btn-ghost" style="width:100%;justify-content:center;font-size:12px" onclick="startSortingSession()">↻ New Session</button>
      </div>
      <div class="stats-list">${rows || '<div style="padding:14px;font-size:11px;color:var(--muted);text-align:center">Answer questions to build history.</div>'}</div>`;
  }
}

function renderSortingContent() {

}

function startSortingSession() {

  renderSortingQuiz();
}

function renderSortingQuiz() {
  const panel = document.getElementById('sortingPanel');
  if (!panel) return;
  if (!sortingQueue.length) { startSortingSession(); return; }
  if (sortingIdx >= sortingQueue.length) { renderSortingSummary(); return; }
  const q = sortingQueue[sortingIdx];
  const stats = sortingAllTime[q.id];
  const allTimeStr = stats && stats.total ? ` · seen ${stats.total}× · ${Math.round(stats.correct / stats.total * 100)}% correct` : '';
  const progressPct = (sortingIdx / sortingQueue.length) * 100;
  const buttons = q.options.map((opt, i) => {
    let cls = 'btn-mc';
    if (sortingAnswered) {
      if (i === q.answer) cls += ' correct';
      else if (i === sortingPicked) cls += ' wrong';
    }
    return `<button class="${cls}" ${sortingAnswered ? 'disabled' : ''} onclick="pickSortingAnswer(${i})">${opt}</button>`;
  }).join('');
  let feedback = '';
  if (sortingAnswered) {
    const right = sortingPicked === q.answer;
    feedback = `<div class="quiz-feedback ${right ? 'right' : 'wrong'}">
      ${right ? '✓ Correct!' : `✗ The answer is: <b>${q.options[q.answer]}</b>`}
      <div class="exp">${q.explanation}</div>
    </div>
    <div class="quiz-actions">
      <button class="btn btn-primary" onclick="nextSortingQuestion()">${sortingIdx === sortingQueue.length - 1 ? 'See Results' : 'Next →'}</button>
    </div>`;

        <div class="quiz-question">${q.question}</div>
        <div class="mc-options">${buttons}</div>
        ${feedback}
      </div>
    </div>`;
}

function pickSortingAnswer(idx) {
  if (sortingAnswered) return;
  sortingAnswered = true;
  sortingPicked = idx;
  const q = sortingQueue[sortingIdx];
  const correct = idx === q.answer;
  sortingSession.total++;
  if (correct) sortingSession.correct++;
  else {
    const reIdx = Math.min(sortingIdx + 3, sortingQueue.length);
    sortingQueue.splice(reIdx, 0, q);
  }
  sortingAllTime[q.id] = sortingAllTime[q.id] || { correct: 0, total: 0 };
  sortingAllTime[q.id].total++;
  if (correct) sortingAllTime[q.id].correct++;
  api('/api/log-quiz', { quizType: 'sorting', questionId: q.id, correct });
  renderSortingQuiz();
  renderSortingSidebar();
}

function nextSortingQuestion() {
  sortingIdx++;
  sortingAnswered = false;
  sortingPicked = null;
  renderSortingQuiz();
  renderSortingSidebar();
}

function renderSortingSummary() {
  const panel = document.getElementById('sortingPanel');
  if (!panel) return;
  const pct = sortingSession.total ? Math.round(sortingSession.correct / sortingSession.total * 100) : 0;
  panel.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-card quiz-summary">
        <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">Session Complete</div>
        <div class="big-num">${sortingSession.correct}/${sortingSession.total}</div>
        <div class="sub">${pct}% accuracy</div>
        <button class="btn btn-primary" onclick="startSortingSession()">↻ New Session</button>
      </div>
    </div>`;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const sheetId = localStorage.getItem('b75_sheet');
  if (sheetId) {
    try { problems = await loadSheets(sheetId); }
    catch (e) { console.warn('Sheets load failed, using built-in data'); problems = [...PROBLEMS]; }
  } else {
    problems = [...PROBLEMS];
  }

  const cats = [...new Set(problems.map(p => p.category))];
  document.getElementById('fCat').innerHTML =
    '<option value="All">All Categories</option>' + cats.map(c => `<option>${c}</option>`).join('');

  try {
    const state = await fetch('/api/state').then(r => r.json());
    done = new Set(state.done || []);
    review = new Set(state.review || []);
    problemData = state.problems || {};
    const quizData = state.quiz || {};
    bigoAllTime = {};
    for (const [qid, qd] of Object.entries(quizData.bigo || {})) {
      const a = qd.attempts || [];
      bigoAllTime[qid] = { total: a.length, correct: a.filter(x => x.correct).length };
    }
    sortingAllTime = {};
    for (const [qid, qd] of Object.entries(quizData.sorting || {})) {
      const a = qd.attempts || [];
      sortingAllTime[qid] = { total: a.length, correct: a.filter(x => x.correct).length };
    }
    patternsAllTime = {};
    for (const [qid, qd] of Object.entries(quizData.pattern || {})) {
      const a = qd.attempts || [];
      patternsAllTime[qid] = { total: a.length, correct: a.filter(x => x.correct).length };
    }
    vocabAllTime = {};
    for (const [qid, qd] of Object.entries(quizData.vocab || {})) {
      const a = qd.attempts || [];
      vocabAllTime[qid] = { total: a.length, correct: a.filter(x => x.correct).length };
    }
    learningState = state.learning || {};
    mockHistory = state.mockHistory || [];
  } catch (e) {
    console.error('Could not reach server:', e);
    document.getElementById('pText').textContent = '⚠ Server offline';
  }

  // Default landing: Learn
  switchMode('learn');
}

init();
</script>
